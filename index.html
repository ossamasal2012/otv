<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>يلا گـــول | Yalla Goal </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        .channel-item {
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .active-card {
            background: linear-gradient(270deg, rgba(16, 185, 129, 0.2) 0%, rgba(15, 23, 42, 0.8) 100%) !important;
            border-color: #10b981 !important;
        }

        .active-btn {
            background: #10b981 !important;
            color: white !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        #dynamic-player-root {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        .video-fit-contain { object-fit: contain !important; }
        .video-fit-cover { object-fit: cover !important; }
        .video-fit-fill { object-fit: fill !important; }

        .plyr {
            height: 100% !important;
            width: 100% !important;
        }

        /* تحكم يدوي في الإخفاء */
        .plyr--hide-manual-controls .plyr__controls,
        .plyr--hide-manual-controls .plyr__caption {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        .overlay-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #020617;
            gap: 1rem;
        }
        
        #iPlayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
            z-index: 40;
            display: none;
        }

        /* زر الأبعاد المدمج داخل Plyr */
        .plyr__controls .plyr__custom-tool {
            order: 7; /* وضعه قبل زر ملء الشاشة */
        }

        .custom-aspect-btn {
            background: rgba(16, 185, 129, 0.2) !important;
            border: 1px solid rgba(16, 185, 129, 0.4) !important;
            color: #10b981 !important;
            padding: 2px 8px !important;
            border-radius: 4px !important;
            font-size: 10px !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            margin: 0 5px !important;
            min-width: 45px;
            text-align: center;
        }

        @media (min-width: 1536px) {
            .aside-container {
                width: 450px !important;
            }
        }
    </style>
</head>
<body class="flex flex-col lg:flex-row">

    <aside class="aside-container w-full lg:w-80 xl:w-96 flex flex-col bg-slate-950 border-l border-slate-900 z-50 order-2 lg:order-1 flex-1 lg:flex-none lg:h-full overflow-hidden">
        <div class="p-4 border-b border-slate-900 hidden lg:block text-center">
            <h1 class="text-xl font-black text-emerald-500 tracking-tight">يلا گـــول</h1>
            <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">تطوير أُسامه - v2.7</p>
        </div>

        <div class="p-3 shrink-0">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-[10px]"></i>
                <input type="text" id="searchInput" oninput="searchChannels()" placeholder="بحث سريع..."
                    class="w-full bg-slate-900 border border-slate-800 rounded-lg py-2 px-3 pr-10 text-xs focus:outline-none focus:border-emerald-500 transition-all text-white placeholder:text-slate-600">
            </div>
        </div>

        <div id="categoryMenu" class="px-3 pb-2 overflow-x-auto no-scrollbar flex gap-1.5 shrink-0"></div>

        <div id="channelsBox" class="flex-1 overflow-y-auto p-3 space-y-1 no-scrollbar"></div>
    </aside>

    <main id="mainPlayerArea" class="w-full lg:flex-1 bg-black relative order-1 lg:order-2 h-[40vh] lg:h-full overflow-hidden">
        
        <div id="placeholderScreen" class="overlay-screen">
            <div class="w-10 h-10 rounded-full border-2 border-slate-800 border-t-emerald-500 animate-spin"></div>
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2">انتظار القناة...</span>
        </div>

        <div id="errorScreen" class="overlay-screen hidden text-center px-10">
            <i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-3"></i>
            <h3 class="text-base font-bold">خطأ في التشغيل</h3>
            <p class="text-[11px] text-slate-500">المصدر غير متاح حالياً</p>
        </div>

        <div id="dynamic-player-root"></div>

        <iframe id="iPlayer" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms" referrerpolicy="no-referrer"></iframe>

    </main>

    <script>
        let myChannels = [];
        let hls = null;
        let plyr = null;
        let currentCat = "الكل";
        let searchQuery = "";
        let favorites = JSON.parse(localStorage.getItem('yalla_favs')) || [];
        let currentAspectRatio = 0; // 0: Fit, 1: Zoom, 2: Fill
        let controlsVisible = true; 

        async function loadChannels() {
            try {
                document.getElementById('placeholderScreen').classList.remove('hidden');
                const res = await fetch("https://raw.githubusercontent.com/ossamasal2012/yalla-data/main/channels.json");
                const data = await res.json();
                myChannels = data;
                renderMenu();
                renderChannels();
                document.getElementById('placeholderScreen').classList.add('hidden');
            } catch (err) {
                console.error("خطأ في تحميل القنوات", err);
                document.getElementById('errorScreen').classList.remove('hidden');
            }
        }

        function renderMenu() {
            const cats = ["الكل", "المفضلة", ...new Set(myChannels.map(c => c[2]))];
            document.getElementById('categoryMenu').innerHTML = cats.map(c => `
                <button onclick="filter('${c}')" class="px-3 py-1 rounded-md text-[10px] font-bold transition-all border border-slate-800 bg-slate-900 text-slate-400 whitespace-nowrap hover:border-slate-700 ${currentCat === c ? 'active-btn' : ''}">
                    ${c}
                </button>
            `).join('');
        }

        function renderChannels() {
            const box = document.getElementById('channelsBox');
            const filtered = myChannels.filter(c => {
                const matchCat = currentCat === "الكل" || (currentCat === "المفضلة" ? favorites.includes(c[0]) : c[2] === currentCat);
                return matchCat && c[0].toLowerCase().includes(searchQuery.toLowerCase());
            });

            box.innerHTML = filtered.map(ch => {
                const isFav = favorites.includes(ch[0]);
                return `
                <div onclick="playChannel('${ch[1]}', '${ch[3]}', '${ch[0]}', this)" 
                    class="channel-item bg-slate-900/30 border border-slate-800/40 p-2.5 rounded-lg flex items-center justify-between group hover:bg-slate-900/60 transition-all">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 opacity-0 group-[.active-card]:opacity-100"></div>
                        <span class="text-[12px] font-bold text-slate-300 group-hover:text-emerald-400 transition-colors">${ch[0]}</span>
                    </div>
                    <button onclick="toggleFavorite(event, '${ch[0]}')" class="focus:outline-none p-1">
                        <i class="fa-star ${isFav ? 'fa-solid text-amber-500' : 'fa-regular text-slate-700'} text-[14px] transition-all hover:scale-110"></i>
                    </button>
                </div>`;
            }).join('');
        }

        function filter(c) { currentCat = c; renderMenu(); renderChannels(); }
        function searchChannels() { searchQuery = document.getElementById('searchInput').value; renderChannels(); }

        function cleanup() {
            if (hls) { hls.destroy(); hls = null; }
            if (plyr) { plyr.destroy(); plyr = null; }
            const root = document.getElementById('dynamic-player-root');
            root.innerHTML = "";
            const iframe = document.getElementById('iPlayer');
            iframe.src = "about:blank";
            iframe.style.display = "none";
            document.getElementById('errorScreen').classList.add('hidden');
            document.getElementById('placeholderScreen').classList.remove('hidden');
            
            currentAspectRatio = 0;
            controlsVisible = true;
        }

        // الوظيفة المحدثة لتبديل الأبعاد
        function toggleAspectRatio(video) {
            if (!video) return;
            currentAspectRatio = (currentAspectRatio + 1) % 3;
            video.classList.remove('video-fit-contain', 'video-fit-cover', 'video-fit-fill');
            
            const labels = ['Fit', 'Zoom', 'Fill'];
            if (currentAspectRatio === 0) video.classList.add('video-fit-contain');
            if (currentAspectRatio === 1) video.classList.add('video-fit-cover');
            if (currentAspectRatio === 2) video.classList.add('video-fit-fill');
            
            // تحديث النص في كل الأزرار (لو وجد أكثر من واحد)
            document.querySelectorAll('.custom-aspect-btn').forEach(btn => {
                btn.innerText = labels[currentAspectRatio];
            });
        }

        function manualToggleControls() {
            if (!plyr) return;
            controlsVisible = !controlsVisible;
            updateControlsVisibility();
        }

        function updateControlsVisibility() {
            const plyrContainer = document.querySelector('.plyr');
            if (!plyrContainer) return;

            if (controlsVisible) {
                plyrContainer.classList.remove('plyr--hide-manual-controls');
            } else {
                plyrContainer.classList.add('plyr--hide-manual-controls');
            }
        }

        function toggleFavorite(event, name) {
            event.stopImmediatePropagation();
            const index = favorites.indexOf(name);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push(name);
            localStorage.setItem('yalla_favs', JSON.stringify(favorites));
            renderChannels();
        }

        function playChannel(url, type, name, el) {
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active-card'));
            el.classList.add('active-card');
            cleanup();

            if (type === 'i') {
                const iframe = document.getElementById('iPlayer');
                iframe.style.display = "block";
                iframe.src = url;
                document.getElementById('placeholderScreen').classList.add('hidden');
            } else {
                const root = document.getElementById('dynamic-player-root');
                const video = document.createElement('video');
                video.id = "vPlayer";
                video.className = "w-full h-full video-fit-contain";
                video.autoplay = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('crossorigin', '');
                root.appendChild(video);

                // النقر للتبديل اليدوي
                root.onclick = (e) => {
                    if (e.target.closest('.plyr__controls')) return;
                    manualToggleControls();
                };

                const plyrOptions = {
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                    settings: ['quality', 'speed'],
                    hideControls: false,
                    clickToPlay: false,
                    tooltips: { controls: false, seek: true },
                    i18n: { quality: 'الجودة', speed: 'السرعة' }
                };

                const setupPlyr = () => {
                    plyr = new Plyr(video, plyrOptions);
                    document.getElementById('placeholderScreen').classList.add('hidden');
                    controlsVisible = true;
                    
                    // منع الإخفاء التلقائي
                    plyr.on('controlshidden', () => {
                        if (controlsVisible) plyr.toggleControls(true);
                    });

                    // حقن زر الـ Aspect Ratio داخل عناصر تحكم Plyr
                    const controls = document.querySelector('.plyr__controls');
                    if (controls) {
                        const aspectBtn = document.createElement('button');
                        aspectBtn.type = 'button';
                        aspectBtn.className = 'plyr__control custom-aspect-btn';
                        aspectBtn.innerText = 'Fit';
                        aspectBtn.onclick = (e) => {
                            e.stopPropagation();
                            toggleAspectRatio(video);
                        };
                        
                        // إضافة الزر في مكان مناسب (قبل زر ملء الشاشة)
                        const fullscreenBtn = controls.querySelector('[data-plyr="fullscreen"]');
                        if (fullscreenBtn) {
                            controls.insertBefore(aspectBtn, fullscreenBtn);
                        } else {
                            controls.appendChild(aspectBtn);
                        }
                    }
                }

                if (Hls.isSupported() && url.includes('.m3u8')) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        const availableQualities = hls.levels.map(l => l.height).sort((a, b) => b - a);
                        const qualityOptions = [0, ...availableQualities];
                        plyrOptions.quality = {
                            default: 0,
                            options: qualityOptions,
                            forced: true,
                            onChange: (q) => {
                                if (q === 0) hls.currentLevel = -1;
                                else {
                                    hls.levels.forEach((level, idx) => {
                                        if (level.height === q) hls.currentLevel = idx;
                                    });
                                }
                            }
                        };
                        plyrOptions.i18n = { ...plyrOptions.i18n, qualityLabel: { 0: 'تلقائي' } };
                        setupPlyr();
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            document.getElementById('placeholderScreen').classList.add('hidden');
                            document.getElementById('errorScreen').classList.remove('hidden');
                        }
                    });
                } else {
                    video.src = url;
                    setupPlyr();
                }
            }
        }

        loadChannels();
    </script>
</body>
</html>
