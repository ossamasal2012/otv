name: Build يلا گول Windows EXE
'on':
  push:
    branches:
    - main
    - master
  workflow_dispatch: null
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Create project structure
      shell: bash
      run: mkdir -p electron-app/src electron-app/assets electron-app/build electron-app/src/icons
    - name: Embed icons
      shell: bash
      env:
        PNG_B64: 
        ICO_B64: 
      run: "node -e \"\n  const fs=require('fs');\n  fs.writeFileSync('electron-app/assets/icon.png', Buffer.from(process.env.PNG_B64,'base64'));\n  fs.writeFileSync('electron-app/build/icon.ico', Buffer.from(process.env.ICO_B64,'base64'));\n  fs.copyFileSync('electron-app/assets/icon.png','electron-app/src/icons/icon.png');\n  console.log('Icons embedded');\n\""
    - name: Copy web assets
      shell: bash
      run: '[ -f index.html ] && cp index.html electron-app/src/index.html || echo "no html"

        for f in *.css *.js; do [ -f "$f" ] && cp "$f" electron-app/src/ 2>/dev/null || true; done'
    - name: Inject HTML splash screen
      shell: bash
      env:
        SPLASH_B64: 
      run: "node -e \"\n  const fs=require('fs'),p='electron-app/src/index.html';\n  if(!fs.existsSync(p)){console.log('no html');process.exit(0);}\n  const sp=Buffer.from(process.env.SPLASH_B64,'base64').toString('utf8');\n  let t=fs.readFileSync(p,'utf8');\n  t=/<body/i.test(t)?t.replace(/<body([^>]*)>/i,'<body$1>\\n'+sp):sp+'\\n'+t;\n  fs.writeFileSync(p,t,'utf8');\n  console.log('splash injected 3s');\n\""
    - name: Write Electron main.js
      shell: bash
      run: "cat > electron-app/main.js << 'MAINEOF'\nconst { app, BrowserWindow, shell } = require(\"electron\");\nconst path = require(\"path\");\nlet win;\nfunction createWindow() {\n  win = new BrowserWindow({\n    width: 1280, height: 800,\n    minWidth: 800, minHeight: 600,\n    icon: path.join(__dirname, \"build\", \"icon.ico\"),\n    title: \"يلا گول\",\n    backgroundColor: \"#0a0a1a\",\n    show: false,\n    autoHideMenuBar: true,\n    webPreferences: {\n      nodeIntegration: false,\n      contextIsolation: true,\n      webSecurity: false,\n      allowRunningInsecureContent: true,\n    },\n  });\n  win.setMenuBarVisibility(false);\n  win.removeMenu();\n  win.loadFile(path.join(__dirname, \"src\", \"index.html\"));\n  win.once(\"ready-to-show\", () => { win.show(); win.maximize(); });\n  win.webContents.session.webRequest.onBeforeSendHeaders((d, cb) => {\n    const h = Object.assign({}, d.requestHeaders);\n    h[\"User-Agent\"] = \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36\";\n    delete h[\"Origin\"]; delete h[\"Referer\"];\n    cb({ requestHeaders: h });\n  });\n  win.webContents.session.webRequest.onHeadersReceived((d, cb) => {\n    const h = Object.assign({}, d.responseHeaders);\n    h[\"access-control-allow-origin\"] = [\"*\"];\n    h[\"access-control-allow-methods\"] = [\"GET,POST,HEAD,OPTIONS\"];\n    h[\"access-control-allow-headers\"] = [\"*\"];\n    cb({ responseHeaders: h });\n  });\n}\napp.whenReady().then(createWindow);\napp.on(\"window-all-closed\", () => { if(process.platform!==\"darwin\") app.quit(); });\nMAINEOF\necho \"main.js written\"\n"
    - name: Write package.json
      shell: bash
      run: "cat > electron-app/package.json << 'PKGEOF'\n{\n  \"name\": \"yalla-gol\",\n  \"version\": \"1.0.0\",\n  \"description\": \"يلا گول - M3U Streaming Player\",\n  \"main\": \"main.js\",\n  \"scripts\": { \"build\": \"electron-builder\" },\n  \"build\": {\n    \"appId\": \"com.yallagol.app\",\n    \"productName\": \"يلا گول\",\n    \"win\": {\n      \"target\": [{ \"target\": \"nsis\", \"arch\": [\"x64\"] }],\n      \"icon\": \"build/icon.ico\"\n    },\n    \"nsis\": {\n      \"oneClick\": false,\n      \"allowToChangeInstallationDirectory\": true,\n      \"createDesktopShortcut\": true,\n      \"createStartMenuShortcut\": true,\n      \"shortcutName\": \"يلا گول\",\n      \"installerIcon\": \"build/icon.ico\",\n      \"uninstallerIcon\": \"build/icon.ico\",\n      \"runAfterFinish\": true\n    },\n    \"directories\": { \"output\": \"dist\" },\n    \"files\": [\"main.js\",\"src/**/*\",\"assets/**/*\",\"build/**/*\"]\n  },\n  \"devDependencies\": {\n    \"electron\": \"^29.0.0\",\n    \"electron-builder\": \"^24.0.0\"\n  }\n}\nPKGEOF\necho \"package.json written\"\n"
    - name: Install dependencies
      working-directory: electron-app
      shell: bash
      run: npm install
    - name: Build Windows Setup EXE
      working-directory: electron-app
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx electron-builder --win --x64
    - name: Rename and find EXE
      shell: bash
      run: "find electron-app/dist -name \"*.exe\" | sort\nEXE=$(find electron-app/dist -name \"*Setup*.exe\" -o -name \"*setup*.exe\" | head -1)\n[ -n \"$EXE\" ] && cp \"$EXE\" electron-app/dist/yalla-gol-setup.exe || \\\n  cp \"$(find electron-app/dist -name '*.exe' | head -1)\" electron-app/dist/yalla-gol-setup.exe\nls -lh electron-app/dist/yalla-gol-setup.exe"
    - name: Upload Windows Setup
      uses: actions/upload-artifact@v4
      with:
        name: yalla-gol-windows-setup
        path: electron-app/dist/yalla-gol-setup.exe
        retention-days: 30
