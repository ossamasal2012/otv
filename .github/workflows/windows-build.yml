name: 🏗️ Build Yalla Goal Windows (EXE)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ══════════════════════════════════════════
      # الخطوة 1 — إعداد بيئة التشغيل ودعم الإنترنت
      # ══════════════════════════════════════════
      - name: 🗂️ Setup Project Structure
        shell: bash
        run: |
          mkdir -p win-app
          if [ -f "yallagoal.html" ]; then
            cp yallagoal.html win-app/index.html
          elif [ -f "index.html" ]; then
            cp index.html win-app/index.html
          fi

          # إنشاء ملف تشغيل مع كسر قيود CORS ودعم الإنترنت الكامل
          cat > win-app/main.js << 'EOF'
          const { app, BrowserWindow, session } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              title: "يلا گـــول - Yalla Goal",
              icon: path.join(__dirname, 'icon.ico'),
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                webSecurity: false, // تعطيل حماية المتصفح للسماح بجلب البث من أي سيرفر
                allowRunningInsecureContent: true // السماح بتشغيل روابط HTTP داخل التطبيق
              }
            });

            win.setMenuBarVisibility(false);

            // حل مشكلة الـ CORS للإنترنت: تعديل الـ Headers لإجبار السيرفرات على قبول الطلب
            session.defaultSession.webRequest.onBeforeSendHeaders((details, callback) => {
              details.requestHeaders['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
              callback({ requestHeaders: details.requestHeaders });
            });

            session.defaultSession.webRequest.onHeadersReceived((details, callback) => {
              callback({
                responseHeaders: {
                  ...details.responseHeaders,
                  'Access-Control-Allow-Origin': ['*'],
                  'Access-Control-Allow-Methods': ['GET, POST, OPTIONS']
                }
              });
            });

            win.loadFile('index.html');
          }

          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          EOF

      # ══════════════════════════════════════════
      # الخطوة 2 — إعدادات الأيقونة والبناء
      # ══════════════════════════════════════════
      - name: 📝 Create package.json
        shell: bash
        run: |
          cat > win-app/package.json << 'EOF'
          {
            "name": "yalla-goal",
            "version": "2.7.0",
            "main": "main.js",
            "scripts": {
              "package": "electron-builder --win portable"
            },
            "build": {
              "appId": "com.yallagoal.desktop",
              "productName": "Yalla Goal",
              "win": {
                "target": "portable",
                "icon": "icon.ico",
                "requestedExecutionLevel": "asInvoker" 
              }
            }
          }
          EOF

      - name: 🖼️ Setup Window Icon
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://i.ibb.co/CKJ5NVv7/Screenshot-2026-04-21-1-52-19-PM.png" -OutFile "win-app/icon.png"

      - name: 📦 Install Tools & Build
        shell: bash
        run: |
          cd win-app
          npm install electron electron-builder --save-dev
          npm run package

      - name: 📤 Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-Windows-Full-Internet
          path: win-app/dist/*.exe
