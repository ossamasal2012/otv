name: 🏗️ Build Yalla Goal Windows Setup

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Setup
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🗂️ Setup Project Structure
        shell: bash
        run: |
          mkdir -p win-app
          cp yallagoal.html win-app/index.html

          # ملف التشغيل البرمجي (Main JS)
          cat > win-app/main.js << 'EOF'
          const { app, BrowserWindow, session } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              title: "يلا گـــول - Yalla Goal",
              icon: path.join(__dirname, 'icon.ico'),
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                webSecurity: false,
                allowRunningInsecureContent: true
              }
            });

            win.setMenuBarVisibility(false);

            session.defaultSession.webRequest.onHeadersReceived((details, callback) => {
              callback({
                responseHeaders: {
                  ...details.responseHeaders,
                  'Access-Control-Allow-Origin': ['*']
                }
              });
            });

            win.loadFile('index.html');
          }

          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          EOF

      - name: 📝 Create package.json (Setup Config)
        shell: bash
        run: |
          cat > win-app/package.json << 'EOF'
          {
            "name": "yalla-goal",
            "version": "2.7.0",
            "main": "main.js",
            "scripts": {
              "package": "electron-builder --win nsis"
            },
            "build": {
              "appId": "com.yallagoal.app",
              "productName": "Yalla Goal",
              "directories": { "output": "dist" },
              "win": {
                "target": "nsis",
                "icon": "icon.ico"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "Yalla Goal يلا گول"
              }
            }
          }
          EOF

      - name: 🖼️ Setup Window Icon
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://i.ibb.co/CKJ5NVv7/Screenshot-2026-04-21-1-52-19-PM.png" -OutFile "win-app/icon.png"

      - name: 📦 Install Tools & Build
        shell: bash
        run: |
          cd win-app
          npm install electron electron-builder --save-dev
          npm run package

      - name: 📤 Upload Setup File
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-Windows-Setup
          path: win-app/dist/*.exe
