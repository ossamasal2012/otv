name: Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;34.0.0" "platforms;android-34"

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Build Setup
        run: bash build.sh

      - name: Grant Gradle Permission
        run: chmod +x yalla-goal/android/gradlew

      - name: Build APK
        run: cd yalla-goal/android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-Stable-v2.7
          path: yalla-goal/android/app/build/outputs/apk/debug/app-debug.apk
