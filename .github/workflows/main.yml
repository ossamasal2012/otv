name: Build يلا گول APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@latest

      - name: Init Capacitor project
        run: |
          mkdir -p cap-project/www
          cd cap-project
          cat > package.json << PKG
          {
            "name": "yalla-gol",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/app": "^6.0.0"
            }
          }
          PKG
          npm install
          cat > capacitor.config.json << CAP
          {
            "appId": "com.yallagol.app",
            "appName": "يلا گول",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true
              }
            },
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            }
          }
          CAP

      - name: Copy web assets
        run: |
          [ -f index.html ] && cp index.html cap-project/www/index.html || true
          for f in *.css *.js *.png *.jpg *.svg; do
            [ -f "$f" ] && cp "$f" cap-project/www/ 2>/dev/null || true
          done

