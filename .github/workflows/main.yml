name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────
      # 1. استنساخ الكود
      # ──────────────────────────────────────────
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. إعداد Node.js
      # ──────────────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ──────────────────────────────────────────
      # 3. إعداد Java (مطلوب لـ Android)
      # ──────────────────────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ──────────────────────────────────────────
      # 4. إعداد Android SDK
      # ──────────────────────────────────────────
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools
        run: |
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platforms;android-34"
          sdkmanager "platform-tools"

      # ──────────────────────────────────────────
      # 5. إنشاء هيكل المشروع + حل CORS
      # ──────────────────────────────────────────
      - name: 🗂️ Create Project Structure
        run: |
          mkdir -p yalla-goal/www
          cp index.html yalla-goal/www/index.html
          cd yalla-goal

          # إنشاء package.json
          cat > package.json << 'EOF'
          {
            "name": "yalla-goal",
            "version": "2.3.0",
            "description": "Yalla Goal - Live Sports TV",
            "main": "index.js",
            "scripts": {
              "build": "echo 'No build needed'"
            }
          }
          EOF

      - name: 📥 Install Capacitor
        run: |
          cd yalla-goal
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # ──────────────────────────────────────────
      # 6. إعداد capacitor.config.json مع كل إعدادات الشبكة وحل CORS
      # ──────────────────────────────────────────
      - name: ⚙️ Create Capacitor Config (with CORS & Network fix)
        run: |
          cat > yalla-goal/capacitor.config.json << 'EOF'
          {
            "appId": "com.yallagoal.app",
            "appName": "يلا گول",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": [
                "*"
              ]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF

      # ──────────────────────────────────────────
      # 7. إضافة منصة Android
      # ──────────────────────────────────────────
      - name: 🤖 Add Android Platform
        run: |
          cd yalla-goal
          npx cap add android

      # ──────────────────────────────────────────
      # 8. حل CORS نهائياً عبر تعديل AndroidManifest.xml
      # ──────────────────────────────────────────
      - name: 🔓 Fix CORS & Internet Permissions in AndroidManifest
        run: |
          MANIFEST="yalla-goal/android/app/src/main/AndroidManifest.xml"

          # إضافة كل الصلاحيات المطلوبة
          sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"

          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n</manifest>|' "$MANIFEST"

          # السماح بالنصوص الواضحة (HTTP) وتعطيل CORS
          sed -i 's|<application|<application\n        android:usesCleartextTraffic="true"\n        android:networkSecurityConfig="@xml/network_security_config"\n        tools:replace="android:usesCleartextTraffic"|' "$MANIFEST"

      # ──────────────────────────────────────────
      # 9. إنشاء Network Security Config لحل CORS نهائياً
      # ──────────────────────────────────────────
      - name: 🌐 Create Network Security Config (Allow ALL traffic)
        run: |
          mkdir -p yalla-goal/android/app/src/main/res/xml
          cat > yalla-goal/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <!-- السماح بكل حركة المرور بدون قيود -->
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
              <!-- السماح الصريح بجميع النطاقات -->
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">*</domain>
              </domain-config>
          </network-security-config>
          EOF

      # ──────────────────────────────────────────
      # 10. تعديل WebView لحل CORS من جانب الكود (Java)
      # ──────────────────────────────────────────
      - name: 🛠️ Patch MainActivity for Full WebView CORS Fix
        run: |
          MAIN_ACTIVITY="yalla-goal/android/app/src/main/java/com/yallagoal/app/MainActivity.java"
          cat > "$MAIN_ACTIVITY" << 'EOF'
          package com.yallagoal.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }

              @Override
              public void onStart() {
                  super.onStart();
                  configureWebView();
              }

              private void configureWebView() {
                  try {
                      WebView webView = getBridge().getWebView();
                      WebSettings settings = webView.getSettings();

                      // ── إعدادات الشبكة والإنترنت ──
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);
                      settings.setAllowFileAccessFromFileURLs(true);
                      settings.setAllowUniversalAccessFromFileURLs(true); // حل CORS الرئيسي

                      // ── السماح بالمحتوى المختلط (HTTP داخل HTTPS) ──
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                      // ── إعدادات الفيديو والوسائط ──
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setLoadWithOverviewMode(true);
                      settings.setUseWideViewPort(true);

                      // ── Cache والأداء ──
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                      // ── User Agent مخصص لتجاوز قيود البث ──
                      settings.setUserAgentString(
                          "Mozilla/5.0 (Linux; Android 13; Pixel 7) " +
                          "AppleWebKit/537.36 (KHTML, like Gecko) " +
                          "Chrome/120.0.0.0 Mobile Safari/537.36"
                      );

                      // ── تمكين WebChromeClient للفيديو كامل الشاشة ──
                      webView.setWebChromeClient(new WebChromeClient());

                      // ── WebViewClient لمنع أخطاء التوجيه ──
                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              return false; // السماح بكل الروابط داخل WebView
                          }
                      });

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      # ──────────────────────────────────────────
      # 11. مزامنة Capacitor
      # ──────────────────────────────────────────
      - name: 🔄 Sync Capacitor
        run: |
          cd yalla-goal
          npx cap sync android

      # ──────────────────────────────────────────
      # 12. منح صلاحيات Gradle
      # ──────────────────────────────────────────
      - name: 🔐 Grant Gradle Execute Permission
        run: |
          chmod +x yalla-goal/android/gradlew

      # ──────────────────────────────────────────
      # 13. بناء APK
      # ──────────────────────────────────────────
      - name: 🏗️ Build Debug APK
        run: |
          cd yalla-goal/android
          ./gradlew assembleDebug --stacktrace

      # ──────────────────────────────────────────
      # 14. البحث عن ملف APK ورفعه
      # ──────────────────────────────────────────
      - name: 🔍 Find APK file
        run: |
          find yalla-goal/android -name "*.apk" -type f
          APK_PATH=$(find yalla-goal/android -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-v2.3-debug
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: ✅ Build Success Summary
        run: |
          echo "============================================"
          echo "✅ تم بناء APK بنجاح!"
          echo "📱 اسم التطبيق: يلا گول"
          echo "🌐 دعم الإنترنت: ✅ مفعّل بالكامل"
          echo "🔓 حل CORS: ✅ مطبّق نهائياً"
          echo "📡 HTTP + HTTPS: ✅ مدعومان"
          echo "🎬 تشغيل HLS/M3U8: ✅ مدعوم"
          echo "============================================"
          APK=$(find yalla-goal/android -name "*.apk" | head -1)
          echo "📦 مسار الملف: $APK"
          ls -lh "$APK"
