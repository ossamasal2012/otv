name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools"

      # ─── إنشاء المشروع ───
      - name: 🗂️ Create Project Structure
        run: |
          mkdir -p yalla-goal/www
          cp index.html yalla-goal/www/index.html
          cat > yalla-goal/package.json << 'EOF'
          {
            "name": "yalla-goal",
            "version": "2.3.0",
            "scripts": { "build": "echo ok" }
          }
          EOF

      - name: 📥 Install Capacitor
        run: |
          cd yalla-goal
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ⚙️ Create Capacitor Config
        run: |
          cat > yalla-goal/capacitor.config.json << 'EOF'
          {
            "appId": "com.yallagoal.app",
            "appName": "YallaGoal",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: 🤖 Add Android Platform
        run: |
          cd yalla-goal
          npx cap add android

      # ─── Network Security Config ───
      - name: 🌐 Create Network Security Config
        run: |
          mkdir -p yalla-goal/android/app/src/main/res/xml
          cat > yalla-goal/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system"/>
                      <certificates src="user"/>
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      # ─── كتابة AndroidManifest.xml من الصفر ───
      - name: 📝 Write AndroidManifest.xml
        run: |
          cat > yalla-goal/android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

      # ─── MainActivity.java ───
      - name: 🛠️ Write MainActivity.java
        run: |
          MAIN_ACTIVITY=$(find yalla-goal/android -name "MainActivity.java" | head -1)
          PACKAGE=$(grep -m1 "^package" "$MAIN_ACTIVITY" | sed 's/package //;s/;//' | tr -d '[:space:]')
          echo "Package: [$PACKAGE]"

          cat > "$MAIN_ACTIVITY" << JAVAEOF
          package ${PACKAGE};

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  fixWebViewSettings();
              }

              private void fixWebViewSettings() {
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView == null) return;
                      WebSettings s = webView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setDatabaseEnabled(true);
                      s.setAllowFileAccess(true);
                      s.setAllowContentAccess(true);
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      s.setMediaPlaybackRequiresUserGesture(false);
                      s.setLoadWithOverviewMode(true);
                      s.setUseWideViewPort(true);
                      s.setUserAgentString(
                          "Mozilla/5.0 (Linux; Android 13; Pixel 7) " +
                          "AppleWebKit/537.36 (KHTML, like Gecko) " +
                          "Chrome/120.0.0.0 Mobile Safari/537.36"
                      );
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          JAVAEOF

      - name: 🔄 Sync Capacitor
        run: |
          cd yalla-goal
          npx cap sync android

      - name: 🔐 Grant Gradle Permission
        run: chmod +x yalla-goal/android/gradlew

      # ─── طباعة هيكل المشروع للتشخيص ───
      - name: 🔍 Debug Project Structure
        run: |
          echo "=== AndroidManifest.xml ==="
          cat yalla-goal/android/app/src/main/AndroidManifest.xml

          echo ""
          echo "=== network_security_config.xml ==="
          cat yalla-goal/android/app/src/main/res/xml/network_security_config.xml

          echo ""
          echo "=== MainActivity.java ==="
          find yalla-goal/android -name "MainActivity.java" -exec cat {} \;

          echo ""
          echo "=== app/build.gradle ==="
          cat yalla-goal/android/app/build.gradle

          echo ""
          echo "=== strings.xml ==="
          find yalla-goal/android -name "strings.xml" -exec cat {} \;

      # ─── البناء مع تسجيل الخطأ الحقيقي ───
      - name: 🏗️ Build Debug APK
        run: |
          cd yalla-goal/android
          # تشغيل Gradle وحفظ الخروج الكامل في ملف
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "══════════════════════════════════════"
            echo "❌ BUILD FAILED — الخطأ الحقيقي:"
            echo "══════════════════════════════════════"
            # استخراج سطور الخطأ الحقيقية
            grep -A 10 "FAILURE\|error:\|Error\|Exception\|what went wrong\|BUILD FAILED" /tmp/gradle_output.txt | head -60
            echo "══════════════════════════════════════"
            exit 1
          fi

      # ─── رفع APK ───
      - name: 🔍 Find APK
        run: |
          APK_PATH=$(find yalla-goal/android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "✅ APK: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-v2.3-debug
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ─── رفع log الخطأ دائماً للتشخيص ───
      - name: 📋 Upload Gradle Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle_output.txt
          retention-days: 7

      - name: ✅ Build Summary
        run: |
          echo "=========================================="
          echo "✅ يلا گول APK جاهز!"
          echo "🌐 CORS: مُحلول نهائياً"
          echo "📡 HTTP + HTTPS: مدعوم"
          echo "🎬 HLS / M3U8: مدعوم"
          echo "=========================================="
