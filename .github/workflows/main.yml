name: Build Android APK (Yalla Goal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install @capacitor/android @capacitor/http
          mkdir -p www
          cp index.html www/

      - name: Initialize Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.ossama.yallagoal",
            "appName": "Yalla Goal",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"]
            },
            "plugins": {
              "CapacitorHttp": { "enabled": true }
            }
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Android Permissions & Network
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: |
          cd android
          # تنظيف أي كاش قديم يدوياً
          rm -rf .gradle
          chmod +x gradlew
          # إجبار النظام على استخدام Java 17 المتوفر في البيئة الحالية
          export JAVA_HOME=$JAVA_HOME_17_X64
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yalla-Goal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
