name: بناء تطبيق Android (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الكود من المستودع
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: تثبيت بيئة Java (مطلوبة لبناء Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: تثبيت مكتبات Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -g @capacitor/assets

      - name: تهيئة مشروع Capacitor (مع مجلد www)
        run: |
          # إنشاء مجلد www لنقل ملفات الويب إليه
          mkdir -p www
          # نقل ملفات المشروع إلى مجلد www
          cp index.html www/
          # إذا كان لديك ملفات أخرى مثل style.css أو script.js، قم بنسخها هنا أيضاً
          # cp style.css www/  (مثال)
          
          # إنشاء مشروع كاباستور (سيتعرف تلقائياً على webDir: "www")
          npx cap init "يلا گول" "com.yallagoal.app"
          
          # إضافة منصة Android
          npx cap add android

      - name: توليد أيقونات Android من icon.png
        run: |
          if [ -f "www/icon.png" ]; then
            # إنشاء المجلدات المطلوبة للأيقونات بأحجام مختلفة
            mkdir -p android/app/src/main/res/drawable-hdpi
            mkdir -p android/app/src/main/res/drawable-mdpi
            mkdir -p android/app/src/main/res/drawable-xhdpi
            mkdir -p android/app/src/main/res/drawable-xxhdpi
            mkdir -p android/app/src/main/res/drawable-xxxhdpi
            
            # نسخ الأيقونة لجميع المقاسات
            cp www/icon.png android/app/src/main/res/drawable-hdpi/icon.png
            cp www/icon.png android/app/src/main/res/drawable-mdpi/icon.png
            cp www/icon.png android/app/src/main/res/drawable-xhdpi/icon.png
            cp www/icon.png android/app/src/main/res/drawable-xxhdpi/icon.png
            cp www/icon.png android/app/src/main/res/drawable-xxxhdpi/icon.png
          else
            echo "خطأ: لم يتم العثور على ملف www/icon.png!"
            exit 1
          fi

      - name: مزامنة الملفات مع مشروع Android
        run: npx cap sync android

      - name: بناء ملف APK (نسخة اختبارية Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع ملف APK الناتج للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: yalla-goal-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
