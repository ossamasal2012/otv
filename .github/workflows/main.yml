name: بناء تطبيق Android (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # تسمح بالتشغيل يدوياً من تبويب Actions

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الكود من المستودع
        uses: actions/checkout@v3

      - name: تثبيت Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: تثبيت بيئة Java (مطلوبة لبناء Android)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: تثبيت مكتبات Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -g @capacitor/assets

      - name: تهيئة مشروع Capacitor
        run: |
          # إنشاء مشروع كاباستور باسم "Yalla Goal"
          npx cap init "يلا گول" "com.yallagoal.app"
          # تعديل إعدادات المجلد الرئيسي ليكون الجذر الحالي (بدلاً من www)
          sed -i 's/"webDir": "www"/"webDir": "."/' capacitor.config.json
          # إضافة منصة Android
          npx cap add android

      - name: توليد أيقونات Android من icon.png
        run: |
          if [ -f "icon.png" ]; then
            # إنشاء المجلدات المطلوبة للأيقونات بأحجام مختلفة
            mkdir -p android/app/src/main/res/drawable-hdpi
            mkdir -p android/app/src/main/res/drawable-mdpi
            mkdir -p android/app/src/main/res/drawable-xhdpi
            mkdir -p android/app/src/main/res/drawable-xxhdpi
            mkdir -p android/app/src/main/res/drawable-xxxhdpi
            # نسخ الأيقونة لجميع المقاسات (سيقوم Android بضبطها تلقائياً)
            cp icon.png android/app/src/main/res/drawable-hdpi/icon.png
            cp icon.png android/app/src/main/res/drawable-mdpi/icon.png
            cp icon.png android/app/src/main/res/drawable-xhdpi/icon.png
            cp icon.png android/app/src/main/res/drawable-xxhdpi/icon.png
            cp icon.png android/app/src/main/res/drawable-xxxhdpi/icon.png
          else
            echo "خطأ: لم يتم العثور على ملف icon.png في جذر المستودع!"
            exit 1
          fi

      - name: مزامنة الملفات مع مشروع Android
        run: npx cap sync android

      - name: بناء ملف APK (نسخة اختبارية Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع ملف APK الناتج للتحميل
        uses: actions/upload-artifact@v3
        with:
          name: yalla-goal-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
