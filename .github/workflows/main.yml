name: Build Yalla Goal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize App Project & Capacitor (Ultra Fast Configuration)
      run: |
        mkdir -p www
        cp index.html www/
        
        # خطوة ذكية لإضافة sandbox لجميع وسوم iframe في ملف الـ HTML تلقائياً لحمايتك ودعم البث
        if [ -f "www/index.html" ]; then
          sed -i 's/<iframe/<iframe sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allowfullscreen/g' www/index.html
          echo "==== تم حقن الـ Sandbox والـ Permissions في الـ iframes بنجاح ===="
        fi

        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        cat <<'EOF' > capacitor.config.json
        {
          "appId": "com.yallagoal.app",
          "appName": "يلا گول",
          "webDir": "www",
          "bundledWebRuntime": false,
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 0,
              "launchAutoHide": true,
              "splashFullScreen": true,
              "splashImmersive": true
            }
          }
        }
        EOF

        npx cap add android

        # 1. تحديث Gradle إلى 8.7
        PROPERTIES_FILE="android/gradle/wrapper/gradle-wrapper.properties"
        if [ -f "$PROPERTIES_FILE" ]; then
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.7-all.zip/g' $PROPERTIES_FILE
          echo "==== تم تحديث Gradle إلى 8.7 ===="
        fi

        # 2. رفع SDK إلى 35
        VARIABLES_FILE="android/variables.gradle"
        if [ -f "$VARIABLES_FILE" ]; then
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/g' $VARIABLES_FILE
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/g' $VARIABLES_FILE
          echo "==== تم تحديث SDK إلى 35 ===="
        fi

        # 3. توحيد إصدار Kotlin
        BUILD_FILE="android/build.gradle"
        if [ -f "$BUILD_FILE" ]; then
          sed -i 's/ext {/ext {\n        kotlinVersion = "1.9.22"/g' $BUILD_FILE
          printf "\nsubprojects {\n    project.configurations.all {\n        resolutionStrategy.eachDependency { details ->\n            if (details.requested.group == 'org.jetbrains.kotlin') {\n                details.useVersion '1.9.22'\n            }\n        }\n    }\n}\n" >> $BUILD_FILE
          echo "==== تم توحيد Kotlin ===="
        fi

    - name: Configure Fullscreen & Native CORS Proxy Client (Lightning Speed Boost)
      run: |
        mkdir -p android/app/src/main/java/com/yallagoal/app
        MAIN_ACTIVITY="android/app/src/main/java/com/yallagoal/app/MainActivity.java"

        cat <<'JAVA' > $MAIN_ACTIVITY
        package com.yallagoal.app;

        import android.graphics.Color;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.View;
        import android.view.ViewGroup;
        import android.view.Window;
        import android.view.WindowInsets;
        import android.view.WindowInsetsController;
        import android.view.WindowManager;
        import android.webkit.MimeTypeMap;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebResourceRequest;
        import android.webkit.WebResourceResponse;
        import android.widget.FrameLayout;
        import com.getcapacitor.BridgeActivity;
        import com.getcapacitor.BridgeWebViewClient;
        import java.io.InputStream;
        import java.io.ByteArrayInputStream;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import java.util.HashMap;
        import java.util.Map;

        public class MainActivity extends BridgeActivity {
            private View customView;
            private WebChromeClient.CustomViewCallback customViewCallback;
            private FrameLayout customViewContainer;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                requestWindowFeature(Window.FEATURE_NO_TITLE);
                getWindow().setFlags(
                    WindowManager.LayoutParams.FLAG_FULLSCREEN,
                    WindowManager.LayoutParams.FLAG_FULLSCREEN
                );
                super.onCreate(savedInstanceState);
                applyFullscreen();
                setupWebView();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
                super.onWindowFocusChanged(hasFocus);
                if (hasFocus) applyFullscreen();
            }

            @Override
            public void onResume() {
                super.onResume();
                applyFullscreen();
            }

            private void applyFullscreen() {
                Window w = getWindow();
                w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                    w.setDecorFitsSystemWindows(false);
                    WindowInsetsController c = w.getInsetsController();
                    if (c != null) {
                        c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                        c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                    }
                    w.setStatusBarColor(Color.TRANSPARENT);
                    w.setNavigationBarColor(Color.TRANSPARENT);
                } else {
                    w.getDecorView().setSystemUiVisibility(
                        View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                        View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                        View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                        View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                        View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                        View.SYSTEM_UI_FLAG_FULLSCREEN
                    );
                }
                if (Build.VERSION.SDK_INT >= 28) {
                    WindowManager.LayoutParams lp = w.getAttributes();
                    lp.layoutInDisplayCutoutMode =
                        WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                    w.setAttributes(lp);
                }
            }

            private void setupWebView() {
                try {
                    WebView wv = getBridge().getWebView();
                    
                    WebSettings s = wv.getSettings();
                    s.setJavaScriptEnabled(true);
                    s.setDomStorageEnabled(true);
                    s.setDatabaseEnabled(true);
                    s.setAllowFileAccess(true);
                    s.setAllowContentAccess(true);
                    s.setAllowFileAccessFromFileURLs(true);
                    s.setAllowUniversalAccessFromFileURLs(true);
                    s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                    s.setMediaPlaybackRequiresUserGesture(false);

                    s.setUseWideViewPort(true);
                    s.setLoadWithOverviewMode(true);
                    s.setCacheMode(WebSettings.LOAD_DEFAULT);

                    s.setUserAgentString(
                        "Mozilla/5.0 (Linux; Android 13; Pixel 7) " +
                        "AppleWebKit/537.36 (KHTML, like Gecko) " +
                        "Chrome/125.0.0.0 Mobile Safari/537.36"
                    );

                    wv.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                    wv.setWebChromeClient(new WebChromeClient() {
                        @Override
                        public void onShowCustomView(View view, CustomViewCallback callback) {
                            if (customView != null) {
                                onHideCustomView();
                                return;
                            }
                            
                            customView = view;
                            customViewCallback = callback;
                            
                            ViewGroup decorView = (ViewGroup) getWindow().getDecorView();
                            customViewContainer = new FrameLayout(MainActivity.this);
                            customViewContainer.setBackgroundColor(Color.BLACK);
                            customViewContainer.addView(customView, new FrameLayout.LayoutParams(
                                    ViewGroup.LayoutParams.MATCH_PARENT,
                                    ViewGroup.LayoutParams.MATCH_PARENT
                            ));
                            decorView.addView(customViewContainer, new ViewGroup.LayoutParams(
                                    ViewGroup.LayoutParams.MATCH_PARENT,
                                    ViewGroup.LayoutParams.MATCH_PARENT
                            ));
                            
                            getBridge().getWebView().setVisibility(View.GONE);
                            applyFullscreen();
                        }

                        @Override
                        public void onHideCustomView() {
                            if (customView == null) return;
                            
                            ViewGroup decorView = (ViewGroup) getWindow().getDecorView();
                            customViewContainer.removeView(customView);
                            decorView.removeView(customViewContainer);
                            
                            customView = null;
                            customViewContainer = null;
                            customViewCallback.onCustomViewHidden();
                            
                            getBridge().getWebView().setVisibility(View.VISIBLE);
                            applyFullscreen();
                        }
                    });

                    if (Build.VERSION.SDK_INT >= 21) {
                        android.webkit.CookieManager cm = android.webkit.CookieManager.getInstance();
                        cm.setAcceptCookie(true);
                        cm.setAcceptThirdPartyCookies(wv, true);
                    }

                    getBridge().setWebViewClient(new CORSClient(getBridge()));
                    System.out.println("==== تم تفعيل محرك البث فائق السرعة لـ يلا گول ====");
                } catch (Exception e) {
                    e.printStackTrace();
                }
            }

            class CORSClient extends BridgeWebViewClient {
                CORSClient(com.getcapacitor.Bridge b) { super(b); }

                @Override
                public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                    String url = r.getUrl().toString();
                    String method = r.getMethod();

                    if ("OPTIONS".equalsIgnoreCase(method)) {
                        return buildCorsResponse(null, "text/plain", 204, null, url);
                    }

                    if (!url.startsWith("http") || url.contains("localhost") || url.contains("capacitor://")) {
                        return super.shouldInterceptRequest(v, r);
                    }

                    if (isStrictRadioStream(url)) {
                        return null; 
                    }

                    try {
                        URL targetUrl = new URL(url);
                        HttpURLConnection conn = (HttpURLConnection) targetUrl.openConnection();
                        conn.setRequestMethod(method);
                        conn.setConnectTimeout(25000);
                        conn.setReadTimeout(25000);
                        conn.setInstanceFollowRedirects(true);

                        boolean hasRange = false;
                        for (Map.Entry<String, String> h : r.getRequestHeaders().entrySet()) {
                            String key = h.getKey();
                            if (!key.equalsIgnoreCase("Origin") && !key.equalsIgnoreCase("Host")) {
                                conn.setRequestProperty(key, h.getValue());
                                if (key.equalsIgnoreCase("Range")) {
                                    hasRange = true;
                                }
                            }
                        }

                        String referer = extractBaseUrl(url);
                        if (referer != null) {
                            conn.setRequestProperty("Referer", referer);
                        }
                        conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/125.0.0.0");
                        
                        if (!hasRange) {
                            conn.setRequestProperty("Range", "bytes=0-");
                        }

                        conn.connect();

                        int statusCode = conn.getResponseCode();
                        if (statusCode < 0) statusCode = 200;

                        InputStream inputStream;
                        try {
                            inputStream = conn.getInputStream();
                        } catch (Exception e) {
                            inputStream = conn.getErrorStream();
                            if (inputStream == null) {
                                inputStream = new ByteArrayInputStream(new byte[0]);
                            }
                        }

                        String contentType = conn.getContentType();
                        if (contentType == null || contentType.isEmpty()) {
                            contentType = detectMimeType(url);
                        }
                        if (contentType.contains(";")) {
                            contentType = contentType.split(";")[0].trim();
                        }

                        Map<String, String> customHeaders = new HashMap<>();
                        
                        // تعديل جوهري: قراءة هيدرز السيرفر وحذف القيود الأمنية للبث والـ iframe
                        for (Map.Entry<String, java.util.List<String>> header : conn.getHeaderFields().entrySet()) {
                            String key = header.getKey();
                            if (key != null && !key.equalsIgnoreCase("X-Frame-Options" ) && !key.equalsIgnoreCase("Content-Security-Policy")) {
                                customHeaders.put(key, header.getValue().get(0));
                            }
                        }

                        return buildCorsResponse(inputStream, contentType, statusCode, customHeaders, url);

                    } catch (Exception e) {
                        return super.shouldInterceptRequest(v, r);
                    }
                }

                private boolean isStrictRadioStream(String url) {
                    String lower = url.toLowerCase();
                    if (lower.contains(".m3u8") || lower.contains(".ts") || lower.contains(".mp4") || lower.contains(".webm")) {
                        return false; 
                    }
                    return lower.contains("radio") || 
                           lower.contains("icecast") || 
                           lower.contains("shoutcast") || 
                           lower.contains("streamlive") ||
                           lower.contains(":8000") || 
                           lower.contains(":8002");
                }

                private String detectMimeType(String url) {
                    String lower = url.toLowerCase();
                    if (lower.contains(".m3u8"))   return "application/vnd.apple.mpegurl";
                    if (lower.contains(".ts"))     return "video/mp2t";
                    if (lower.contains(".mp4"))    return "video/mp4";
                    if (lower.contains(".webm"))   return "audio/webm";
                    return "text/html"; 
                }

                private WebResourceResponse buildCorsResponse(InputStream is, String mimeType, int status, Map<String, String> extraHeaders, String url) {
                    Map<String, String> headers = new HashMap<>();
                    headers.put("Access-Control-Allow-Origin", "*");
                    headers.put("Access-Control-Allow-Methods", "GET, POST, PUT, DELETE, HEAD, OPTIONS");
                    headers.put("Access-Control-Allow-Headers", "*");
                    headers.put("Access-Control-Expose-Headers", "*");
                    headers.put("Accept-Ranges", "bytes");

                    if (extraHeaders != null) {
                        headers.putAll(extraHeaders);
                    }

                    // إحباط قيود التضمين بشكل نهائي وقاطع
                    headers.remove("X-Frame-Options");
                    headers.remove("Content-Security-Policy");

                    if (is == null) is = new ByteArrayInputStream(new byte[0]);
                    String reason = "OK";

                    return new WebResourceResponse(mimeType, "utf-8", status, reason, headers, is);
                }

                private String extractBaseUrl(String url) {
                    try {
                        URL u = new URL(url);
                        return u.getProtocol() + "://" + u.getHost();
                    } catch (Exception e) {
                        return null;
                    }
                }
            }
        }
        JAVA

        # صلاحيات الإنترنت وتشغيل الوسائط في AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' \
            android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            android/app/src/main/AndroidManifest.xml

        # تفعيل cleartext + hardware acceleration لدعم الفيديو والصوت
        sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' \
            android/app/src/main/AndroidManifest.xml

    - name: Download & Apply App Custom Icon
      run: |
        curl -L -o app_icon.png "https://raw.githubusercontent.com/ossamasal2012/otv/main/icon.png"
        npm install -g @capacitor/assets
        mkdir -p assets
        cp app_icon.png assets/icon.png
        npx capacitor-assets generate --android

    - name: Sync Capacitor Project
      run: |
        npx cap sync android

    - name: Build Android APK (Release)
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon --no-build-cache

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yalla-Goal-Premium-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
