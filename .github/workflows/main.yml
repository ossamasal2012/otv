name: Build OTV LIVE APK (Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "OTV LIVE" "com.ossama.otv" --web-dir .

      # =============================================================
      # ⬇️ ضع رابط أيقونة التطبيق هنا ⬇️
      # =============================================================
      - name: Download App Icon
        run: |
          curl -L "https://i.ibb.co/fYkRx1fB/Gemini-Generated-Image-ekxxfoekxxfoekxx.png" -o icon.png
      # =============================================================

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Build Android Project
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTV-Live-Capacitor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
