name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: 🖼️ Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: 🗂️ Create Project & www
        run: |
          mkdir -p yalla-goal/www

          if [ -f "yallagoal.html" ]; then
            cp yallagoal.html yalla-goal/www/index.html
          elif [ -f "index.html" ]; then
            cp index.html yalla-goal/www/index.html
          else
            echo "❌ ملف HTML غير موجود!" && exit 1
          fi

          # حقن CSS+JS لإصلاح المشكلة من داخل HTML
          cat >> yalla-goal/www/index.html << 'INJECT'
<style>
html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#000!important}
</style>
<script>
// فتح الروابط خارجياً
document.addEventListener('click',function(e){
  var t=e.target.closest('a');
  if(t&&t.href&&t.href.startsWith('http')){
    e.preventDefault();
    if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Browser){
      window.Capacitor.Plugins.Browser.open({url:t.href});
    }else{window.open(t.href,'_system');}
  }
});
// إزالة أي padding يضيفه Capacitor
window.addEventListener('load',function(){
  if(window.Capacitor){
    document.documentElement.style.cssText='margin:0!important;padding:0!important;';
    document.body.style.cssText='margin:0!important;padding:0!important;';
    new MutationObserver(function(){
      document.documentElement.style.setProperty('padding','0','important');
      document.body.style.setProperty('padding','0','important');
    }).observe(document.body,{attributes:true,attributeFilter:['style']});
  }
});
</script>
INJECT

          cat > yalla-goal/package.json << 'EOF'
{
  "name": "yalla-goal",
  "version": "2.7.0",
  "private": true,
  "dependencies": {
    "@capacitor/android": "^6.0.0",
    "@capacitor/browser": "^6.0.0",
    "@capacitor/cli": "^6.0.0",
    "@capacitor/core": "^6.0.0"
  }
}
EOF

      - name: 📥 Install Dependencies
        run: cd yalla-goal && npm install

      - name: ⚙️ Capacitor Config
        run: |
          cat > yalla-goal/capacitor.config.json << 'EOF'
{
  "appId": "com.ossamasal.player",
  "appName": "Yalla Goal",
  "webDir": "www",
  "server": {
    "androidScheme": "https",
    "cleartext": true,
    "allowNavigation": ["*"]
  },
  "android": {
    "allowMixedContent": true,
    "backgroundColor": "#000000"
  },
  "plugins": {
    "Browser": {"presentationStyle": "fullscreen"}
  }
}
EOF

      - name: 🤖 Add Android Platform
        run: cd yalla-goal && npx cap add android

      - name: 🔄 Sync & Fix Dependencies
        run: |
          cd yalla-goal
          npx cap sync android

          cat >> android/app/build.gradle << 'EOF'

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    }
}
EOF

      - name: 📡 AndroidManifest & Network Security
        run: |
          mkdir -p yalla-goal/android/app/src/main/res/xml
          cat > yalla-goal/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="true">
        <trust-anchors><certificates src="system"/></trust-anchors>
    </base-config>
</network-security-config>
EOF

          cat > yalla-goal/android/app/src/main/AndroidManifest.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="يلا گول"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:supportsRtl="true"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true"
        android:networkSecurityConfig="@xml/network_security_config">
        <activity
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
            android:name=".MainActivity"
            android:label="يلا گول"
            android:theme="@style/AppTheme.NoActionBarLaunch"
            android:launchMode="singleTask"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

      # ==============================================================
      # الحل الجذري: MainActivity بنهج edge-to-edge الصحيح
      # المشكلة الحقيقية: أندرويد 14 يفرض gesture bar ولا يمكن إخفاؤه
      # الحل: تمديد الـ WebView خلف الـ gesture bar بلون شفاف
      # ==============================================================
      - name: 📱 MainActivity - True Edge-to-Edge Fix
        run: |
          MAIN_ACTIVITY="yalla-goal/android/app/src/main/java/com/ossamasal/player/MainActivity.java"

          cat > "$MAIN_ACTIVITY" << 'EOF'
package com.ossamasal.player;

import android.graphics.Color;
import android.os.Build;
import android.os.Bundle;
import android.view.View;
import android.view.Window;
import android.view.WindowInsets;
import android.view.WindowInsetsController;
import android.view.WindowManager;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {

    @Override
    public void onCreate(Bundle savedInstanceState) {
        // ====================================================
        // يجب أن يكون هذا كله قبل super.onCreate()
        // ====================================================
        Window window = getWindow();

        // 1) السماح للمحتوى بالامتداد خلف أشرطة النظام
        window.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);

        // 2) جعل الأشرطة شفافة تماماً حتى يظهر المحتوى خلفها
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
            window.setStatusBarColor(Color.TRANSPARENT);
            window.setNavigationBarColor(Color.TRANSPARENT);
        }

        // 3) منع النظام من تغيير لون الأشرطة (أندرويد 10+)
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
            window.setNavigationBarContrastEnforced(false);
            window.setStatusBarContrastEnforced(false);
        }

        super.onCreate(savedInstanceState);

        // 4) بعد super: إخبار الـ decor بعدم ترك مساحة للأشرطة
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
            window.setDecorFitsSystemWindows(false);
        }

        hideSystemUI();
    }

    @Override
    public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) hideSystemUI();
    }

    @Override
    public void onResume() {
        super.onResume();
        hideSystemUI();
    }

    private void hideSystemUI() {
        Window window = getWindow();

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
            // أندرويد 11+: إخفاء الأشرطة مع السماح بظهورها مؤقتاً بالسحب
            WindowInsetsController c = window.getInsetsController();
            if (c != null) {
                c.hide(WindowInsets.Type.statusBars());
                c.hide(WindowInsets.Type.navigationBars());
                c.setSystemBarsBehavior(
                    WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                );
            }
        } else {
            // أندرويد 10 وما دونه
            View dv = window.getDecorView();
            final int flags =
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_FULLSCREEN;
            dv.setSystemUiVisibility(flags);
            dv.setOnSystemUiVisibilityChangeListener(v -> {
                if ((v & View.SYSTEM_UI_FLAG_FULLSCREEN) == 0) {
                    dv.postDelayed(() -> dv.setSystemUiVisibility(flags), 100);
                }
            });
        }
    }
}
EOF

      - name: 🎨 Styles - True Fullscreen Theme
        run: |
          mkdir -p yalla-goal/android/app/src/main/res/values
          cat > yalla-goal/android/app/src/main/res/values/styles.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
        <item name="colorPrimary">#020617</item>
        <item name="colorPrimaryDark">#000000</item>
        <item name="colorAccent">#10b981</item>
        <item name="android:windowBackground">#000000</item>
        <item name="android:windowNoTitle">true</item>
        <item name="android:windowActionBar">false</item>
        <!-- المفتاح الرئيسي: يجعل المحتوى يمتد خلف أشرطة النظام -->
        <item name="android:windowLayoutInDisplayCutoutMode" tools:targetApi="o_mr1">shortEdges</item>
    </style>

    <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
        <item name="android:windowFullscreen">true</item>
        <item name="android:windowBackground">#000000</item>
        <!-- شفافية كاملة للأشرطة -->
        <item name="android:statusBarColor">#00000000</item>
        <item name="android:navigationBarColor">#00000000</item>
        <!-- تعطيل contrast enforcement -->
        <item name="android:enforceNavigationBarContrast" tools:targetApi="q">false</item>
        <item name="android:enforceStatusBarContrast" tools:targetApi="q">false</item>
        <item name="android:windowOptOutEdgeToEdgeEnforcement" tools:targetApi="vanilla_ice_cream">true</item>
    </style>
</resources>
EOF

          # إضافة xmlns:tools للـ manifest
          sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android"|xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"|' \
            yalla-goal/android/app/src/main/res/values/styles.xml

      - name: 🖼️ Generate App Icons
        run: |
          curl -L "https://i.ibb.co/CKJ5NVv7/Screenshot-2026-04-21-1-52-19-PM.png" -o /tmp/icon.png
          BASE="yalla-goal/android/app/src/main/res"
          declare -A SIZES=(["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192)
          for SUFFIX in "${!SIZES[@]}"; do
            SIZE=${SIZES[$SUFFIX]}
            mkdir -p "$BASE/mipmap-$SUFFIX"
            convert /tmp/icon.png -resize ${SIZE}x${SIZE}^ -gravity center -extent ${SIZE}x${SIZE} "$BASE/mipmap-$SUFFIX/ic_launcher.png"
            convert /tmp/icon.png -resize ${SIZE}x${SIZE}^ -gravity center -extent ${SIZE}x${SIZE} "$BASE/mipmap-$SUFFIX/ic_launcher_round.png"
            convert /tmp/icon.png -resize ${SIZE}x${SIZE} -gravity center -background none -extent ${SIZE}x${SIZE} "$BASE/mipmap-$SUFFIX/ic_launcher_foreground.png"
            convert -size ${SIZE}x${SIZE} xc:#020617 "$BASE/mipmap-$SUFFIX/ic_launcher_background.png"
          done
          find "$BASE" -name "ic_launcher.xml" -delete
          find "$BASE" -name "ic_launcher_round.xml" -delete

      - name: 🔐 Grant Gradle Permission
        run: chmod +x yalla-goal/android/gradlew

      - name: 🏗️ Build APK
        run: cd yalla-goal/android && ./gradlew assembleDebug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-Stable-v2.7
          path: yalla-goal/android/app/build/outputs/apk/debug/app-debug.apk
