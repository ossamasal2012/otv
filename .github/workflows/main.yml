name: Build Lightweight Yalla Goal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize App Project & Capacitor
      run: |
        mkdir -p www
        # نسخ ملف index.html إلى المجلد الذي سيتم تحويله
        cp index.html www/
        
        npm init -y
        # تثبيت الحزم الأساسية فقط لجعل التطبيق خفيفاً جداً
        npm install @capacitor/core @capacitor/cli @capacitor/android

        # إعداد التطبيق ليعمل بدون شاشة بداية (Splash Screen) وبشكل مباشر
        cat <<'EOF' > capacitor.config.json
        {
          "appId": "com.yallagoal.app",
          "appName": "يلا گول",
          "webDir": "www",
          "bundledWebRuntime": false,
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 0,
              "launchAutoHide": true
            }
          }
        }
        EOF

        npx cap add android

        PROPERTIES_FILE="android/gradle/wrapper/gradle-wrapper.properties"
        if [ -f "$PROPERTIES_FILE" ]; then
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.7-all.zip/g' $PROPERTIES_FILE
        fi

        VARIABLES_FILE="android/variables.gradle"
        if [ -f "$VARIABLES_FILE" ]; then
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' $VARIABLES_FILE
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' $VARIABLES_FILE
        fi

        BUILD_FILE="android/build.gradle"
        if [ -f "$BUILD_FILE" ]; then
          sed -i 's/ext {/ext {\n        kotlinVersion = "1.9.22"/g' $BUILD_FILE
          printf "\nsubprojects {\n    project.configurations.all {\n        resolutionStrategy.eachDependency { details ->\n            if (details.requested.group == 'org.jetbrains.kotlin') {\n                details.useVersion '1.9.22'\n            }\n        }\n    }\n}\n" >> $BUILD_FILE
        fi

    - name: Configure AndroidManifest.xml (Performance & Permissions)
      run: |
        # إضافة الصلاحيات وتفعيل Hardware Acceleration لتسريع الأداء على الأجهزة الضعيفة
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' \
            android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            android/app/src/main/AndroidManifest.xml
        sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' \
            android/app/src/main/AndroidManifest.xml

    - name: Download & Apply App Custom Icon
      run: |
        # تحميل الأيقونة الخاصة بك وتطبيقها على التطبيق
        curl -L -o app_icon.png "https://raw.githubusercontent.com/ossamasal2012/otv/main/icon.png"
        npm install -g @capacitor/assets
        mkdir -p assets
        cp app_icon.png assets/icon.png
        # إنشاء الأيقونة فقط لتجنب إضافة صور Splash ثقيلة
        npx capacitor-assets generate --android --icon

    - name: Sync Capacitor Project
      run: npx cap sync android

    - name: Build Android APK (Debug)
      run: |
        cd android
        chmod +x ./gradlew
        # استخدام parallel لتسريع عملية البناء على سيرفرات جيت هاب
        ./gradlew assembleDebug --no-daemon --parallel

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yalla-Goal-Light-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
