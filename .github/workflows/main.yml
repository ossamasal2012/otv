name: Build OTV LIVE APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # =============================================================
      # ⬇️ ضع رابط أيقونة التطبيق (PNG) بدلاً من الرابط أدناه ⬇️
      # =============================================================
      - name: Download App Icon
        run: |
          curl -L "https://i.ibb.co/fYkRx1fB/Gemini-Generated-Image-ekxxfoekxxfoekxx.png" -o icon.png
      # =============================================================

      - name: Initialize and Build APK
        run: |
          # إعداد مشروع Bubblewrap بناءً على ملف HTML الخاص بك
          bubblewrap init --manifest="index (5).html" \
          --meta='{"name": "OTV LIVE", "shortName": "OTV", "startUrl": "/index (5).html", "themeColor": "#050505", "backgroundColor": "#050505", "display": "standalone"}' \
          --icon="icon.png"
          
          # بناء التطبيق والموافقة على التراخيص تلقائياً
          bubblewrap build --accept_license

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTV-Live-Release-APK
          path: ./*.apk
