name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # تفعيل التخزين المؤقت الذكي

      - name: Initialize and Build Project
        run: |
          # بناء البيئة الأساسية
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          
          # تهيئة أندرويد
          npx cap init "Ossama TV" "com.ossama.tv" --web-dir www
          npx cap add android

          # تحميل الأيقونة
          mkdir -p resources
          curl -L "https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/icon-only.png" -o resources/icon.png
          
          # توليد الأصول والمزامنة
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          # حل مشكلة الصلاحيات و Jar file
          chmod +x gradlew
          ./gradlew clean # تنظيف البناء السابق لضمان عدم وجود ملفات Jar معطوبة
          ./gradlew assembleDebug --no-daemon # تشغيل البناء بدون محرك خلفي لتقليل استهلاك الذاكرة

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ossama-TV-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
