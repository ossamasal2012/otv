name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools"

      # ─── إنشاء هيكل المشروع ───
      - name: 🗂️ Create Project Structure
        run: |
          mkdir -p yalla-goal/www
          cp index.html yalla-goal/www/index.html

          cat > yalla-goal/package.json << 'EOF'
          {
            "name": "yalla-goal",
            "version": "2.3.0",
            "description": "Yalla Goal Live TV",
            "scripts": { "build": "echo ok" }
          }
          EOF

      - name: 📥 Install Capacitor
        run: |
          cd yalla-goal
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ⚙️ Create Capacitor Config
        run: |
          cat > yalla-goal/capacitor.config.json << 'EOF'
          {
            "appId": "com.yallagoal.app",
            "appName": "يلا گول",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: 🤖 Add Android Platform
        run: |
          cd yalla-goal
          npx cap add android

      # ─── Network Security Config ───
      - name: 🌐 Create Network Security Config
        run: |
          mkdir -p yalla-goal/android/app/src/main/res/xml
          cat > yalla-goal/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system"/>
                      <certificates src="user"/>
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      # ─── Patch AndroidManifest ───
      - name: 🔓 Patch AndroidManifest.xml
        run: |
          MANIFEST="yalla-goal/android/app/src/main/AndroidManifest.xml"

          python3 << PYEOF
          import xml.etree.ElementTree as ET

          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          ET.register_namespace('tools',   'http://schemas.android.com/tools')

          tree = ET.parse('${MANIFEST}')
          root = tree.getroot()

          ANDROID = 'http://schemas.android.com/apk/res/android'
          TOOLS   = 'http://schemas.android.com/tools'

          # تأكد من وجود xmlns:tools
          root.set('xmlns:tools', TOOLS)

          # إضافة صلاحيات الإنترنت
          perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.ACCESS_WIFI_STATE',
              'android.permission.CHANGE_NETWORK_STATE',
          ]
          existing = {e.get(f'{{{ANDROID}}}name') for e in root.findall('uses-permission')}
          for perm in perms:
              if perm not in existing:
                  el = ET.SubElement(root, 'uses-permission')
                  el.set(f'{{{ANDROID}}}name', perm)

          # تعديل <application>
          app = root.find('application')
          if app is not None:
              app.set(f'{{{ANDROID}}}usesCleartextTraffic', 'true')
              app.set(f'{{{ANDROID}}}networkSecurityConfig', '@xml/network_security_config')
              app.set(f'{{{TOOLS}}}replace',
                      'android:usesCleartextTraffic,android:networkSecurityConfig')

          tree.write('${MANIFEST}', xml_declaration=True, encoding='utf-8')
          print("✅ AndroidManifest patched successfully")
          PYEOF

          cat "$MANIFEST"

      # ─── Patch MainActivity ───
      - name: 🛠️ Patch MainActivity.java
        run: |
          MAIN_ACTIVITY=$(find yalla-goal/android -name "MainActivity.java" | head -1)
          echo "Found: $MAIN_ACTIVITY"

          PACKAGE=$(grep -m1 "^package" "$MAIN_ACTIVITY" | sed 's/package //;s/;//' | tr -d '[:space:]')
          echo "Package: [$PACKAGE]"

          cat > "$MAIN_ACTIVITY" << JAVAEOF
          package ${PACKAGE};

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  fixWebViewSettings();
              }

              private void fixWebViewSettings() {
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView == null) return;
                      WebSettings s = webView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setDatabaseEnabled(true);
                      s.setAllowFileAccess(true);
                      s.setAllowContentAccess(true);
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      s.setMediaPlaybackRequiresUserGesture(false);
                      s.setLoadWithOverviewMode(true);
                      s.setUseWideViewPort(true);
                      s.setUserAgentString(
                          "Mozilla/5.0 (Linux; Android 13; Pixel 7) " +
                          "AppleWebKit/537.36 (KHTML, like Gecko) " +
                          "Chrome/120.0.0.0 Mobile Safari/537.36"
                      );
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          JAVAEOF

          echo "=== MainActivity.java ==="
          cat "$MAIN_ACTIVITY"

      - name: 🔄 Sync Capacitor
        run: |
          cd yalla-goal
          npx cap sync android

      - name: 🔐 Grant Gradle Execute Permission
        run: chmod +x yalla-goal/android/gradlew

      # ─── البناء الفعلي مع إظهار الخطأ كاملاً ───
      - name: 🏗️ Build Debug APK
        run: |
          cd yalla-goal/android
          ./gradlew assembleDebug --stacktrace

      # ─── البحث عن APK بطريقة آمنة ───
      - name: 🔍 Find and Verify APK
        run: |
          echo "=== Searching for APK files ==="
          find yalla-goal/android -name "*.apk" -type f 2>/dev/null || echo "No APK found"

          APK_PATH=$(find yalla-goal/android -name "*.apk" -type f 2>/dev/null | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: APK not found! Build may have failed."
            exit 1
          fi

          echo "✅ APK found: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-v2.3-debug
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: ✅ Build Summary
        run: |
          echo "=========================================="
          echo "✅ يلا گول APK جاهز للتحميل!"
          echo "🌐 CORS: مُحلول نهائياً"
          echo "📡 HTTP + HTTPS: مدعوم"
          echo "🎬 HLS / M3U8: مدعوم"
          echo "APK: $APK_PATH"
          echo "=========================================="
