name: Build Android APK (Yalla Goal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Tools & Dependencies
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install @capacitor/android @capacitor/http

      - name: Prepare Web Assets
        run: |
          # إنشاء المجلد والتأكد من وجود الملف بداخله
          mkdir -p www
          cp index.html www/
          # إنشاء ملف إعدادات جديد تماماً لضمان عدم وجود أخطاء مسار
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.ossama.yallagoal",
            "appName": "Yalla Goal",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF

      - name: Add & Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Fix Permissions & Manifest
        run: |
          # إضافة الصلاحيات ودعم الروابط العادية
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yalla-Goal-Final-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
