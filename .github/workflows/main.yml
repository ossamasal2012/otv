name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: 🖼️ Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ══════════════════════════════════════════
      # الخطوة 1 — تجهيز ملفات الويب (Yalla Goal)
      # ══════════════════════════════════════════
      - name: 🗂️ Create Project & www
        run: |
          mkdir -p yalla-goal/www

          if [ -f "yallagoal.html" ]; then
            cp yallagoal.html yalla-goal/www/index.html
          elif [ -f "index.html" ]; then
            cp index.html yalla-goal/www/index.html
          else
            echo "❌ ملف HTML غير موجود!" && exit 1
          fi

          # ✅ فتح الروابط في المتصفح الخارجي
          cat >> yalla-goal/www/index.html << 'JSEOF'
          <script>
            document.addEventListener('click', function(e) {
              var target = e.target.closest('a');
              if (target && target.href && target.href.startsWith('http')) {
                e.preventDefault();
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
                  window.Capacitor.Plugins.Browser.open({ url: target.href });
                } else {
                  window.open(target.href, '_system');
                }
              }
            });
          </script>
          JSEOF

          cat > yalla-goal/package.json << 'EOF'
          {
            "name": "yalla-goal",
            "version": "2.7.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/browser": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

      - name: 📥 Install Dependencies
        run: |
          cd yalla-goal
          npm install

      - name: ⚙️ Capacitor Config (CORS & Navigation)
        run: |
          cat > yalla-goal/capacitor.config.json << 'EOF'
          {
            "appId": "com.ossamasal.player",
            "appName": "Yalla Goal",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": false
            },
            "plugins": {
              "Browser": {
                "presentationStyle": "fullscreen"
              }
            }
          }
          EOF

      - name: 🤖 Add Android Platform
        run: |
          cd yalla-goal
          npx cap add android

      # ══════════════════════════════════════════
      # الخطوة 2 — حل مشكلة التضارب (Duplicate Class)
      # ══════════════════════════════════════════
      - name: 🔄 Capacitor Sync & Dependency Fix
        run: |
          cd yalla-goal
          npx cap sync android

          GRADLE_APP="android/app/build.gradle"

          # إضافة androidx.core لدعم WindowInsetsControllerCompat
          sed -i '/dependencies {/a\\    implementation "androidx.core:core:1.12.0"' "$GRADLE_APP"
          cat >> "$GRADLE_APP" << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
              }
          }
          EOF

      # ══════════════════════════════════════════
      # الخطوة 3 — إعدادات الإنترنت والأمان (AndroidManifest)
      # ══════════════════════════════════════════
      - name: 📡 Network & Permissions Config
        run: |
          mkdir -p yalla-goal/android/app/src/main/res/xml
          cat > yalla-goal/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          cat > yalla-goal/android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="يلا گول"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="يلا گول"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # ══════════════════════════════════════════
      # الخطوة 4 — تفعيل Immersive Mode (الشاشة الكاملة الحقيقية)
      # يخفي: شريط الحالة + شريط الإيماءات + شريط التنقل تماماً
      # ══════════════════════════════════════════
      - name: 📱 Enable Full Immersive Mode (Hide Status & Navigation Bars)
        run: |
          MAIN_ACTIVITY="yalla-goal/android/app/src/main/java/com/ossamasal/player/MainActivity.java"

          cat > "$MAIN_ACTIVITY" << 'EOF'
          package com.ossamasal.player;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  Window window = getWindow();
                  // يجب قبل super.onCreate لمنع وميض الأشرطة
                  window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  window.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      window.setStatusBarColor(Color.TRANSPARENT);
                      window.setNavigationBarColor(Color.TRANSPARENT);
                  }
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(window, false);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideSystemUI();
              }

              private void hideSystemUI() {
                  Window window = getWindow();
                  View decorView = window.getDecorView();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      // ===== Android 11+ =====
                      // WindowInsetsControllerCompat يعمل بشكل صحيح على Android 14
                      WindowInsetsControllerCompat insetsController =
                          WindowCompat.getInsetsController(window, decorView);
                      if (insetsController != null) {
                          insetsController.hide(WindowInsetsCompat.Type.systemBars());
                          insetsController.hide(WindowInsetsCompat.Type.navigationBars());
                          insetsController.hide(WindowInsetsCompat.Type.statusBars());
                          insetsController.setSystemBarsBehavior(
                              WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                      // طبقة ثانية للأمان
                      WindowInsetsController direct = window.getInsetsController();
                      if (direct != null) {
                          direct.hide(WindowInsets.Type.systemBars());
                          direct.hide(WindowInsets.Type.navigationBars());
                          direct.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      // ===== Android 10 وما دونه =====
                      final int flags = View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN;
                      decorView.setSystemUiVisibility(flags);
                      window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                      window.clearFlags(WindowManager.LayoutParams.FLAG_FORCE_NOT_FULLSCREEN);
                      decorView.setOnSystemUiVisibilityChangeListener(visibility -> {
                          if ((visibility & View.SYSTEM_UI_FLAG_FULLSCREEN) == 0) {
                              decorView.postDelayed(() ->
                                  decorView.setSystemUiVisibility(flags), 100);
                          }
                      });
                  }
              }
          }
          EOF

          echo "✅ تم تفعيل Immersive Mode بنجاح"

      # ══════════════════════════════════════════
      # الخطوة 5 — إعداد styles.xml لإخفاء ActionBar والعنوان
      # ══════════════════════════════════════════
      - name: 🎨 Configure App Themes (No Title / No ActionBar)
        run: |
          STYLES_DIR="yalla-goal/android/app/src/main/res/values"
          mkdir -p "$STYLES_DIR"

          cat > "$STYLES_DIR/styles.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- ثيم أساسي بدون ActionBar -->
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#020617</item>
                  <item name="colorPrimaryDark">#020617</item>
                  <item name="colorAccent">#10b981</item>
                  <item name="android:windowBackground">#020617</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
              </style>

              <!-- ثيم شاشة التحميل: شاشة كاملة تماماً -->
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowIsTranslucent">false</item>
                  <item name="android:windowBackground">#020617</item>
                  <item name="android:statusBarColor">#020617</item>
                  <item name="android:navigationBarColor">#020617</item>
              </style>
          </resources>
          EOF

          echo "✅ تم ضبط الثيمات بنجاح"

      # ══════════════════════════════════════════
      # الخطوة 6 — معالجة الأيقونة (App Icon)
      # ══════════════════════════════════════════
      - name: 🖼️ Generate Comprehensive App Icons
        run: |
          curl -L "https://i.ibb.co/CKJ5NVv7/Screenshot-2026-04-21-1-52-19-PM.png" -o /tmp/icon.png

          BASE="yalla-goal/android/app/src/main/res"

          declare -A SIZES=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )

          for SUFFIX in "${!SIZES[@]}"; do
            SIZE=${SIZES[$SUFFIX]}
            DIR_MIPMAP="$BASE/mipmap-$SUFFIX"
            DIR_DRAWABLE="$BASE/drawable-$SUFFIX"
            mkdir -p "$DIR_MIPMAP"
            mkdir -p "$DIR_DRAWABLE"

            convert /tmp/icon.png -resize ${SIZE}x${SIZE}^ -gravity center -extent ${SIZE}x${SIZE} "$DIR_MIPMAP/ic_launcher.png"
            convert /tmp/icon.png -resize ${SIZE}x${SIZE}^ -gravity center -extent ${SIZE}x${SIZE} "$DIR_MIPMAP/ic_launcher_round.png"
            convert /tmp/icon.png -resize ${SIZE}x${SIZE} -gravity center -background none -extent ${SIZE}x${SIZE} "$DIR_MIPMAP/ic_launcher_foreground.png"
            convert -size ${SIZE}x${SIZE} xc:#020617 "$DIR_MIPMAP/ic_launcher_background.png"
          done

          find "$BASE" -name "ic_launcher.xml" -delete
          find "$BASE" -name "ic_launcher_round.xml" -delete

          echo "✅ تم تحديث جميع الأيقونات بنجاح"

      - name: 🔐 Grant Gradle Permission
        run: chmod +x yalla-goal/android/gradlew

      - name: 🏗️ Build Final APK
        run: |
          cd yalla-goal/android
          ./gradlew assembleDebug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-Stable-v2.7
          path: yalla-goal/android/app/build/outputs/apk/debug/app-debug.apk
