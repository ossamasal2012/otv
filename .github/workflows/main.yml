name: Build APK from index.html

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # هذه الخطوة ستقوم بإنشاء المشروع من الصفر حول ملف index.html الخاص بك
      - name: Auto-Generate Capacitor Project
        run: |
          # 1. إنشاء ملف package.json وهمي
          npm init -y
          
          # 2. تثبيت مكتبات Capacitor المطلوبة
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
          # 3. إنشاء مجلد لملفات الويب ونقل ملف index.html إليه
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          
          # 4. تهيئة إعدادات Capacitor (تم وضع اسم التطبيق: Ossama App)
          npx cap init "Ossama App" "com.ossama.app" --web-dir www
          
          # 5. تحميل الأيقونة (استبدل الرابط أدناه برابط أيقونتك)
          mkdir -p resources
          curl -L "https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/icon-only.png" -o resources/icon.png
          npx capacitor-assets generate --android
          
          # 6. إضافة منصة أندرويد والمزامنة
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ossama-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
