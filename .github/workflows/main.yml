name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────
      # 1. استنساخ الكود
      # ──────────────────────────────────────────
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. إعداد Node.js
      # ──────────────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ──────────────────────────────────────────
      # 3. إعداد Java 17
      # ──────────────────────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ──────────────────────────────────────────
      # 4. إعداد Android SDK
      # ──────────────────────────────────────────
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      # ──────────────────────────────────────────
      # 5. إنشاء هيكل المشروع
      # ──────────────────────────────────────────
      - name: 🗂️ Create Project Structure
        run: |
          mkdir -p yalla-goal/www
          cp index.html yalla-goal/www/index.html
          cd yalla-goal

          cat > package.json << 'PKGJSON'
          {
            "name": "yalla-goal",
            "version": "2.3.0",
            "description": "Yalla Goal Live TV",
            "scripts": { "build": "echo ok" }
          }
          PKGJSON

      - name: 📥 Install Capacitor
        run: |
          cd yalla-goal
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # ──────────────────────────────────────────
      # 6. capacitor.config.json
      # ──────────────────────────────────────────
      - name: ⚙️ Create Capacitor Config
        run: |
          cat > yalla-goal/capacitor.config.json << 'EOF'
          {
            "appId": "com.yallagoal.app",
            "appName": "يلا گول",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      # ──────────────────────────────────────────
      # 7. إضافة Android Platform
      # ──────────────────────────────────────────
      - name: 🤖 Add Android Platform
        run: |
          cd yalla-goal
          npx cap add android

      # ──────────────────────────────────────────
      # 8. Network Security Config
      # ──────────────────────────────────────────
      - name: 🌐 Create Network Security Config
        run: |
          mkdir -p yalla-goal/android/app/src/main/res/xml
          cat > yalla-goal/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      # ──────────────────────────────────────────
      # 9. تعديل AndroidManifest.xml
      # ──────────────────────────────────────────
      - name: 🔓 Patch AndroidManifest.xml
        run: |
          MANIFEST="yalla-goal/android/app/src/main/AndroidManifest.xml"

          # إضافة xmlns:tools
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android"|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"

          # إضافة صلاحيات الإنترنت قبل <application
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />\n    <application|' "$MANIFEST"

          # إضافة خصائص application
          sed -i 's|<application|<application\n        android:usesCleartextTraffic="true"\n        android:networkSecurityConfig="@xml/network_security_config"\n        tools:replace="android:usesCleartextTraffic,android:networkSecurityConfig"|' "$MANIFEST"

          echo "=== AndroidManifest.xml ==="
          cat "$MANIFEST"

      # ──────────────────────────────────────────
      # 10. MainActivity.java - حل CORS
      # ──────────────────────────────────────────
      - name: 🛠️ Patch MainActivity.java
        run: |
          MAIN_ACTIVITY=$(find yalla-goal/android -name "MainActivity.java" | head -1)
          echo "Found MainActivity at: $MAIN_ACTIVITY"

          # استخراج اسم الحزمة الحقيقي من الملف الأصلي
          PACKAGE=$(grep -m1 "^package" "$MAIN_ACTIVITY" | sed 's/package //;s/;//')
          echo "Package: $PACKAGE"

          cat > "$MAIN_ACTIVITY" << JAVAEOF
          package ${PACKAGE};

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  fixWebViewSettings();
              }

              private void fixWebViewSettings() {
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView == null) return;
                      WebSettings s = webView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setDatabaseEnabled(true);
                      s.setAllowFileAccess(true);
                      s.setAllowContentAccess(true);
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      s.setMediaPlaybackRequiresUserGesture(false);
                      s.setLoadWithOverviewMode(true);
                      s.setUseWideViewPort(true);
                      s.setUserAgentString(
                          "Mozilla/5.0 (Linux; Android 13; Pixel 7) " +
                          "AppleWebKit/537.36 (KHTML, like Gecko) " +
                          "Chrome/120.0.0.0 Mobile Safari/537.36"
                      );
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          JAVAEOF

          echo "=== MainActivity.java ==="
          cat "$MAIN_ACTIVITY"

      # ──────────────────────────────────────────
      # 11. مزامنة Capacitor
      # ──────────────────────────────────────────
      - name: 🔄 Sync Capacitor
        run: |
          cd yalla-goal
          npx cap sync android

      # ──────────────────────────────────────────
      # 12. منح صلاحيات Gradle وبناء APK
      # ──────────────────────────────────────────
      - name: 🔐 Grant Gradle Execute Permission
        run: chmod +x yalla-goal/android/gradlew

      - name: 🏗️ Build Debug APK
        run: |
          cd yalla-goal/android
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -150

      # ──────────────────────────────────────────
      # 13. رفع APK
      # ──────────────────────────────────────────
      - name: 🔍 Find APK
        run: |
          APK_PATH=$(find yalla-goal/android -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✅ APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-v2.3-debug
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: ✅ Build Summary
        run: |
          echo "=========================================="
          echo "✅ يلا گول APK جاهز!"
          echo "🌐 CORS: مُحلول نهائياً"
          echo "📡 HTTP+HTTPS: مدعوم"
          echo "🎬 HLS/M3U8: مدعوم"
          echo "=========================================="
