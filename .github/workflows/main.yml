name: Build Lightweight Yalla Goal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize App Project & Capacitor
      run: |
        mkdir -p www
        cp index.html www/
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

        cat <<'EOF' > capacitor.config.json
        {
          "appId": "com.yallagoal.app",
          "appName": "يلا گول",
          "webDir": "www",
          "bundledWebRuntime": false,
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 0,
              "launchAutoHide": true
            }
          }
        }
        EOF

        npx cap add android

        # تعديل إصدارات Gradle لضمان الاستقرار
        PROPERTIES_FILE="android/gradle/wrapper/gradle-wrapper.properties"
        sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/g' $PROPERTIES_FILE

    - name: Fix Android Build Compatibility
      run: |
        # تحديث إعدادات البناء لضمان توافق الـ SDK
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle
        
        # إزالة الصلاحيات المكررة وتفعيل تسريع الأداء
        sed -i '/<uses-permission android:name="android.permission.INTERNET"/d' android/app/src/main/AndroidManifest.xml || true
        sed -i '/<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/d' android/app/src/main/AndroidManifest.xml || true
        
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
        
        sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

    - name: Download & Apply App Custom Icon
      run: |
        curl -L -o app_icon.png "https://raw.githubusercontent.com/ossamasal2012/otv/main/icon.png"
        npm install -g @capacitor/assets
        mkdir -p assets
        cp app_icon.png assets/icon.png
        npx capacitor-assets generate --android

    - name: Sync Capacitor Project
      run: npx cap sync android

    - name: Build Android APK (Debug)
      run: |
        cd android
        chmod +x ./gradlew
        # استخدام flags لتقليل استهلاك الموارد أثناء البناء
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yalla-Goal-Light-APK
        path: android/app/build/outputs/apk/debug/يلا سيف.apk
