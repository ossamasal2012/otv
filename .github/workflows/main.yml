name: Build Yalla Goal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize App Project & Capacitor
      run: |
        mkdir -p www
        cp index.html www/
        npm init -y
        # تثبيت الـ Dependencies الأساسية والـ Plugins لتخطي الـ CORS وملء الشاشة
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar @capacitor/navigation-bar
        npx cap init "يلا گول" "com.yallagoal.app" --web-dir=www
        npx cap add android

    - name: Configure Fullscreen & Disable Default Splash Screen
      run: |
        # تعديل ملف الإعدادات لتعطيل الـ Splash الافتراضية البيضاء
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.yallagoal.app",
          "appName": "يلا گول",
          "webDir": "www",
          "server": {
            "androidScheme": "https",
            "allowNavigation": ["*"]
          },
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 0,
              "launchAutoHide": true
            }
          }
        }
        EOF

        # تعديل كود الـ Java الرئيسي في الأندرويد لإخفاء أشرطة النظام والإشعارات فوراً (ملء الشاشة الحقيقي)
        MAIN_ACTIVITY="android/app/src/main/java/com/yallagoal/app/MainActivity.java"
        cat <<EOF > $MAIN_ACTIVITY
        package com.yallagoal.app;

        import android.os.Bundle;
        import android.view.View;
        import android.view.WindowManager;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState) ;
                
                // إخفاء شريط الإشعارات (Status Bar)
                getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                    WindowManager.LayoutParams.FLAG_FULLSCREEN);
                
                // تفعيل وضع ملء الشاشة الغامر لإخفاء الإيماءات وأزرار التنقل (Immersive Mode)
                View decorView = getWindow().getDecorView();
                int uiOptions = View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY;
                decorView.setSystemUiVisibility(uiOptions);
            }
        }
        EOF

        # السماح بطلب بيانات الـ HTTP والـ Internet في ملف الـ AndroidManifest
        MANIFEST="android/app/src/main/main/AndroidManifest.xml"
        # إضافة صلاحيات الإنترنت الكاملة وتعديل الـ Application للسماح بالمرور الآمن
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

    - name: Download & Apply App Custom Icon
      run: |
        # تحميل أيقونة تطبيق "يلا گول" الفخمة التي أرسلتها
        curl -L -o app_icon.png "https://raw.githubusercontent.com/ossamasal2012/otv/main/icon.png"
        
        # تثبيت أداة توليد الأيقونات لجميع مقاسات الأندرويد تلقائياً
        npm install -g @capacitor/assets
        mkdir -p assets
        cp app_icon.png assets/icon.png
        
        # توليد الأيقونات وتحديث مجلد الأندرويد بها
        npx capacitor-assets generate --android

    - name: Sync Capacitor Project
      run: |
        npx cap sync android

    - name: Build Android APK (Release)
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yalla-Goal-Premium-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
