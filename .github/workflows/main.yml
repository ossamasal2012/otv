name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🗂️ Create Project Structure
        run: |
          mkdir -p yalla-goal/www
          cp index.html yalla-goal/www/index.html
          cd yalla-goal
          cat > package.json << 'PKGJSON'
          {
            "name": "yalla-goal",
            "version": "2.3.1",
            "description": "Yalla Goal Live TV",
            "scripts": { "build": "echo ok" }
          }
          PKGJSON

      - name: 📥 Install Capacitor
        run: |
          cd yalla-goal
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ⚙️ Create Capacitor Config
        run: |
          cat > yalla-goal/capacitor.config.json << 'EOF'
          {
            "appId": "com.yallagoal.app",
            "appName": "يلا گول",
            "webDir": "www",
            "server": { "androidScheme": "https", "cleartext": true, "allowNavigation": ["*"] },
            "android": { "allowMixedContent": true }
          }
          EOF

      - name: 🤖 Add Android Platform
        run: |
          cd yalla-goal
          npx cap add android

      # إصلاح خطأ الـ XML و الـ Java Release بشكل جذري
      - name: 🛠️ Final Fixes (Manifest & Java)
        run: |
          # 1. إصلاح الـ Manifest بدون كسر الـ XML
          MANIFEST="yalla-goal/android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          
          # 2. إجبار Gradle على استخدام Java 17 لتجنب خطأ "source release 21"
          GRADLE_PROPS="yalla-goal/android/gradle.properties"
          echo "org.gradle.java.home=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GRADLE_PROPS"
          
          # 3. التأكد من توافق إصدارات البناء
          APP_GRADLE="yalla-goal/android/app/build.gradle"
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' "$APP_GRADLE"
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/' "$APP_GRADLE"

      - name: 🔄 Sync Capacitor
        run: |
          cd yalla-goal
          npx cap sync android

      - name: 🏗️ Build Debug APK
        run: |
          cd yalla-goal/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-v2.3.1-Final
          path: yalla-goal/android/app/build/outputs/apk/debug/app-debug.apk
