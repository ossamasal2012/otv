      - name: Add Android platform
        working-directory: cap-project
        run: npx cap add android

      - name: Patch AndroidManifest
        run: |
          M="cap-project/android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_NETWORK_STATE" "$M"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />|' "$M"
          fi
          sed -i 's|android:label="@string/app_name"|android:label="@string/app_name"\n        android:usesCleartextTraffic="true"\n        android:networkSecurityConfig="@xml/network_security_config"|' "$M"
          sed -i 's|android:theme="@style/[^"]*"|android:theme="@style/FullscreenTheme"|' "$M"

      - name: Create network_security_config.xml
        run: |
          mkdir -p cap-project/android/app/src/main/res/xml
          printf "%s" '<?xml version="1.0" encoding="utf-8"?><network-security-config><base-config cleartextTrafficPermitted="true"><trust-anchors><certificates src="system"/><certificates src="user"/></trust-anchors></base-config></network-security-config>' > cap-project/android/app/src/main/res/xml/network_security_config.xml

      - name: Create themes (Fullscreen + no splash)
        run: |
          RES="cap-project/android/app/src/main/res"
          for DIR in values values-v28 values-v30; do
            mkdir -p "$RES/$DIR"
            cat > "$RES/$DIR/fullscreen_themes.xml" << THEME
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="FullscreenTheme" parent="Theme.AppCompat.NoActionBar">
              <item name="android:windowFullscreen">true</item>
              <item name="android:windowBackground">@android:color/black</item>
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
              <item name="android:windowTranslucentStatus">true</item>
              <item name="android:windowTranslucentNavigation">true</item>
            </style>
            <style name="LaunchTheme" parent="Theme.AppCompat.NoActionBar">
              <item name="android:windowBackground">@android:color/black</item>
              <item name="android:windowFullscreen">true</item>
            </style>
            <style name="NormalTheme" parent="Theme.AppCompat.NoActionBar">
              <item name="android:windowBackground">@android:color/black</item>
            </style>
          </resources>
          THEME
          done

          # launch_background = شاشة سوداء فارغة
          for DIR in drawable drawable-v21; do
            mkdir -p "$RES/$DIR"
            printf "%s" '<?xml version="1.0" encoding="utf-8"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@android:color/black"/></layer-list>' > "$RES/$DIR/launch_background.xml"
          done

      - name: Write strings.xml
        run: |
          mkdir -p cap-project/android/app/src/main/res/values
          printf "%s" '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">يلا گول</string></resources>' > cap-project/android/app/src/main/res/values/strings.xml

      - name: Write MainActivity.java
        run: |
          MAIN=$(find cap-project/android -name "MainActivity.java" | head -1)
          ACTUAL_PKG=$(grep -o "applicationId \"[^\"]*\"" cap-project/android/app/build.gradle | grep -o "\"[^\"]*\"" | tr -d '"' | head -1)
          PKG=${ACTUAL_PKG:-com.yallagol.app}
          cat > "$MAIN" << JAVA
          package $PKG;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.io.InputStream;
          import java.io.ByteArrayInputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashMap;
          import java.util.Map;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle s) {
              requestWindowFeature(Window.FEATURE_NO_TITLE);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);
              super.onCreate(s);
              applyFullscreen();
              setupWebView();
            }
            @Override public void onWindowFocusChanged(boolean h) { super.onWindowFocusChanged(h); if(h) applyFullscreen(); }
            @Override public void onResume() { super.onResume(); applyFullscreen(); }
            private void applyFullscreen() {
              Window w = getWindow();
              w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if(Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                w.setDecorFitsSystemWindows(false);
                WindowInsetsController c = w.getInsetsController();
                if(c!=null) { c.hide(WindowInsets.Type.statusBars()|WindowInsets.Type.navigationBars()); c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE); }
                w.setStatusBarColor(Color.TRANSPARENT); w.setNavigationBarColor(Color.TRANSPARENT);
              } else {
                w.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_STABLE|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_FULLSCREEN);
              }
              if(Build.VERSION.SDK_INT>=28) { w.getAttributes().layoutInDisplayCutoutMode=WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES; w.setAttributes(w.getAttributes()); }
            }
            private void setupWebView() {
              try {
                WebView wv = getBridge().getWebView();
                WebSettings s = wv.getSettings();
                s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
                s.setAllowFileAccess(true); s.setAllowContentAccess(true);
                s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true);
                s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                s.setMediaPlaybackRequiresUserGesture(false);
                s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                s.setUserAgentString("Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36");
                if(Build.VERSION.SDK_INT>=21) { android.webkit.CookieManager cm=android.webkit.CookieManager.getInstance(); cm.setAcceptCookie(true); cm.setAcceptThirdPartyCookies(wv,true); }
                getBridge().setWebViewClient(new CORSClient(getBridge()));
              } catch(Exception e) { e.printStackTrace(); }
            }
            class CORSClient extends BridgeWebViewClient {
              CORSClient(com.getcapacitor.Bridge b) { super(b); }
              @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                String url = r.getUrl().toString();
                if("OPTIONS".equalsIgnoreCase(r.getMethod())) return cors(null,"text/plain",204);
                if(!url.startsWith("http")) return super.shouldInterceptRequest(v,r);
                if(url.contains("localhost")||url.contains("capacitor://")) return super.shouldInterceptRequest(v,r);
                try {
                  HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();
                  c.setRequestMethod(r.getMethod()); c.setConnectTimeout(20000); c.setReadTimeout(20000); c.setInstanceFollowRedirects(true);
                  for(Map.Entry<String,String> h:r.getRequestHeaders().entrySet()) { if(!h.getKey().equalsIgnoreCase("Origin")) c.setRequestProperty(h.getKey(),h.getValue()); }
                  c.setRequestProperty("User-Agent","Mozilla/5.0"); c.setRequestProperty("Accept","*/*");
                  c.connect();
                  int st=c.getResponseCode(); if(st<0) st=200;
                  InputStream is; try { is=c.getInputStream(); } catch(Exception e) { is=c.getErrorStream(); if(is==null) is=new ByteArrayInputStream(new byte[0]); }
                  String mt=c.getContentType(); if(mt==null) mt=mime(url); if(mt.contains(";")) mt=mt.split(";")[0].trim();
                  return cors(is,mt,st);
                } catch(Exception e) { return super.shouldInterceptRequest(v,r); }
              }
              private WebResourceResponse cors(InputStream is,String m,int st) {
                Map<String,String> h=new HashMap<>();
                h.put("Access-Control-Allow-Origin","*"); h.put("Access-Control-Allow-Methods","GET,POST,HEAD,OPTIONS"); h.put("Access-Control-Allow-Headers","*");
                if(is==null) is=new ByteArrayInputStream(new byte[0]);
                return new WebResourceResponse(m,"utf-8",st,st<400?"OK":"Err",h,is);
              }
              private String mime(String u) {
                u=u.toLowerCase();
                if(u.contains(".m3u8")) return "application/vnd.apple.mpegurl";
                if(u.contains(".m3u")) return "audio/x-mpegurl";
                if(u.contains(".ts")) return "video/MP2T";
                if(u.contains(".mp4")) return "video/mp4";
                return "application/octet-stream";
              }
            }
          }
          JAVA

      - name: Sync Capacitor
        working-directory: cap-project
        run: npx cap sync android

      - name: Generate PNG icons and remove XML adaptive icons
        run: |
          sudo apt-get install -y imagemagick -q 2>&1 | tail -1
          RES="cap-project/android/app/src/main/res"
          SRC="cap-project/www/icons/icon.png"

          # احذف كل XML أيقونات Capacitor التي تتجاهل PNG
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -f  "$RES/values/ic_launcher_background.xml"

          # ولّد PNG لكل الكثافات
          for ENTRY in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            DIR="${ENTRY%%:*}"
            SZ="${ENTRY##*:}"
            mkdir -p "$RES/$DIR"
            # احذف foreground القديم
            rm -f "$RES/$DIR/ic_launcher_foreground.png"
            # ولّد الأيقونة
            convert "$SRC" -resize "${SZ}x${SZ}^" -gravity center -background white -extent "${SZ}x${SZ}" "$RES/$DIR/ic_launcher.png"
            convert "$SRC" -resize "${SZ}x${SZ}^" -gravity center -background white -extent "${SZ}x${SZ}" "$RES/$DIR/ic_launcher_round.png"
            echo "  $DIR (${SZ}px)"
          done

          # تنظيف colors.xml من ic_launcher_background المكررة
          COLORS="$RES/values/colors.xml"
          if [ -f "$COLORS" ]; then
            grep -v "ic_launcher_background" "$COLORS" > /tmp/colors_clean.xml && mv /tmp/colors_clean.xml "$COLORS"
          fi

          echo "Icons done:"
          find "$RES" -name "ic_launcher*.png" | sort

      - name: Fix Java compatibility
        run: |
          find cap-project/android -name "build.gradle" -exec sed -i "s|JavaVersion.VERSION_[0-9_]*|JavaVersion.VERSION_21|g" {} +
          echo "org.gradle.jvmargs=-Xmx4g" >> cap-project/android/gradle.properties

      - name: Build APK
        working-directory: cap-project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yalla-gol-apk
          path: cap-project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
