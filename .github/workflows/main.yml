name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # نستخدم "working-directory: otv" في كل خطوة تحتاج للملفات البرمجية
      - name: Install Dependencies
        working-directory: otv
        run: npm install

      - name: Install Capacitor Assets Tool
        run: npm install -g @capacitor/assets

      - name: Build Web Project
        working-directory: otv
        run: npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Add Android Platform
        working-directory: otv
        run: npx cap add android

      - name: Download and Set App Icon
        working-directory: otv
        run: |
          mkdir -p resources
          # استبدل الرابط أدناه برابط صورتك المباشر
          curl -L "https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/icon-only.png" -o resources/icon.png
          capacitor-assets generate --android

      - name: Sync Capacitor with Android
        working-directory: otv
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: otv/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-App-Debug-APK
          path: otv/android/app/build/outputs/apk/debug/app-debug.apk
