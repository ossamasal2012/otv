name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools"

      - name: 🖼️ Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ══════════════════════════════════════════
      # إنشاء المشروع بالمسار الصحيح
      # ══════════════════════════════════════════
      - name: 🗂️ Create Project Structure
        run: |
          mkdir -p yalla-goal

          # إنشاء www داخل مجلد المشروع مباشرة
          mkdir -p yalla-goal/www

          # نسخ index.html مع التأكد
          cp index.html yalla-goal/www/index.html

          # تحقق
          echo "=== محتوى www ==="
          ls -lh yalla-goal/www/
          echo "=== أول 5 سطور من index.html ==="
          head -5 yalla-goal/www/index.html

          cat > yalla-goal/package.json << 'EOF'
          {
            "name": "yalla-goal",
            "version": "2.3.0",
            "scripts": { "build": "echo ok" }
          }
          EOF

      - name: 📥 Install Capacitor
        run: |
          cd yalla-goal
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ⚙️ Create Capacitor Config
        run: |
          # webDir يجب أن يكون مسار نسبي من مجلد المشروع
          cat > yalla-goal/capacitor.config.json << 'EOF'
          {
            "appId": "com.yallagoal.app",
            "appName": "YallaGoal",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

          echo "=== capacitor.config.json ==="
          cat yalla-goal/capacitor.config.json

      - name: 🤖 Add Android Platform
        run: |
          cd yalla-goal
          npx cap add android

      # ══════════════════════════════════════════
      # التأكد من نسخ الملفات إلى assets
      # ══════════════════════════════════════════
      - name: 🔄 Sync Capacitor (copies www → android assets)
        run: |
          cd yalla-goal
          npx cap sync android

          # تحقق أن index.html وصل إلى assets
          ASSET_PATH="android/app/src/main/assets/public/index.html"
          if [ -f "$ASSET_PATH" ]; then
            echo "✅ index.html موجود في assets"
            ls -lh "$ASSET_PATH"
          else
            echo "❌ index.html غير موجود في assets! جاري النسخ يدوياً..."
            mkdir -p android/app/src/main/assets/public
            cp www/index.html android/app/src/main/assets/public/index.html
            echo "✅ تم النسخ اليدوي"
            ls -lh android/app/src/main/assets/public/
          fi

      # ══════════════════════════════════════════
      # 🖼️ أيقونات التطبيق
      # ══════════════════════════════════════════
      - name: 🖼️ Generate App Icons
        run: |
          curl -L "https://i.ibb.co/CKJ5NVv7/Screenshot-2026-04-21-1-52-19-PM.png" \
            -o /tmp/icon_original.png
          echo "✅ Icon downloaded"

          BASE="yalla-goal/android/app/src/main/res"

          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            mkdir -p "$BASE/$DIR"

            convert /tmp/icon_original.png \
              -resize ${SIZE}x${SIZE} \
              -gravity center \
              -background "#020617" \
              -extent ${SIZE}x${SIZE} \
              "$BASE/$DIR/ic_launcher.png"

            convert /tmp/icon_original.png \
              -resize ${SIZE}x${SIZE} \
              \( +clone \
                -threshold -1 -negate \
                -fill white \
                -draw "circle $((SIZE/2)),$((SIZE/2)) $((SIZE/2)),0" \
              \) \
              -alpha off -compose CopyOpacity -composite \
              -background "#020617" -alpha remove \
              "$BASE/$DIR/ic_launcher_round.png"

            echo "  ✅ $DIR: ${SIZE}x${SIZE}"
          done

      # ══════════════════════════════════════════
      # Network Security + Manifest
      # ══════════════════════════════════════════
      - name: 🌐 Network Security Config
        run: |
          mkdir -p yalla-goal/android/app/src/main/res/xml
          cat > yalla-goal/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system"/>
                      <certificates src="user"/>
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      - name: 📝 Write AndroidManifest.xml
        run: |
          cat > yalla-goal/android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

      # ══════════════════════════════════════════
      # MainActivity - بدون OkHttp (كان يسبب مشاكل)
      # CORS يُحل عبر WebSettings فقط
      # ══════════════════════════════════════════
      - name: 🛠️ Write MainActivity.java
        run: |
          MAIN_ACTIVITY=$(find yalla-goal/android -name "MainActivity.java" | head -1)
          PACKAGE=$(grep -m1 "^package" "$MAIN_ACTIVITY" | sed 's/package //;s/;//' | tr -d '[:space:]')
          echo "Package: [$PACKAGE]"

          cat > "$MAIN_ACTIVITY" << JAVAEOF
          package ${PACKAGE};

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              @SuppressLint("SetJavaScriptEnabled")
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  fixWebViewSettings();
              }

              private void fixWebViewSettings() {
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView == null) return;

                      WebSettings s = webView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setDatabaseEnabled(true);
                      s.setAllowFileAccess(true);
                      s.setAllowContentAccess(true);
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      s.setMediaPlaybackRequiresUserGesture(false);
                      s.setLoadWithOverviewMode(true);
                      s.setUseWideViewPort(true);
                      s.setCacheMode(WebSettings.LOAD_DEFAULT);
                      s.setUserAgentString(
                          "Mozilla/5.0 (Linux; Android 13; Pixel 7) " +
                          "AppleWebKit/537.36 (KHTML, like Gecko) " +
                          "Chrome/120.0.0.0 Mobile Safari/537.36"
                      );

                      webView.setWebChromeClient(new WebChromeClient());
                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              return false;
                          }
                      });

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          JAVAEOF

      # ══════════════════════════════════════════
      # Gradle: حل Kotlin + بدون OkHttp
      # ══════════════════════════════════════════
      - name: 🔧 Fix app/build.gradle
        run: |
          APP_GRADLE="yalla-goal/android/app/build.gradle"
          cat >> "$APP_GRADLE" << 'EOF'

          // ─── حل تعارض Kotlin stdlib ───
          configurations.all {
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
                  force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.0"
              }
          }
          EOF

      - name: 🔐 Grant Gradle Permission
        run: chmod +x yalla-goal/android/gradlew

      # ── تحقق نهائي قبل البناء ──
      - name: 🔍 Final Assets Check
        run: |
          echo "=== محتوى assets/public ==="
          find yalla-goal/android/app/src/main/assets -type f | head -20
          echo ""
          echo "=== هل index.html موجود؟ ==="
          ls -lh yalla-goal/android/app/src/main/assets/public/index.html 2>/dev/null \
            && echo "✅ موجود" \
            || echo "❌ غير موجود - نسخ يدوي..."

          # نسخ يدوي احتياطي
          mkdir -p yalla-goal/android/app/src/main/assets/public
          cp yalla-goal/www/index.html yalla-goal/android/app/src/main/assets/public/index.html
          echo "✅ index.html جاهز في assets"

      - name: 🏗️ Build Debug APK
        run: |
          cd yalla-goal/android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "══════════════════════════════════════"
            echo "❌ الخطأ الحقيقي:"
            grep -A 5 "What went wrong\|error:\|Caused by" /tmp/gradle_output.txt | head -40
            echo "══════════════════════════════════════"
            exit 1
          fi

      - name: 🔍 Find APK
        run: |
          APK_PATH=$(find yalla-goal/android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then echo "❌ APK not found!"; exit 1; fi
          echo "✅ APK: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-v2.3-debug
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: 📋 Upload Gradle Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle_output.txt
          retention-days: 7

      - name: ✅ Build Summary
        run: |
          echo "=========================================="
          echo "✅ يلا گول APK جاهز!"
          echo "📄 index.html: منسوخ في assets/public"
          echo "🖼️  الأيقونة: مخصصة"
          echo "☕ Java: 21"
          echo "🌐 CORS: مُحلول"
          echo "📡 HTTP + HTTPS: مدعوم"
          echo "🎬 HLS / M3U8: مدعوم"
          echo "=========================================="
