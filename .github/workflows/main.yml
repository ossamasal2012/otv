name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # هذه الخطوة تبحث عن المجلد الذي يحتوي على package.json وتنفذ الأوامر بداخله
      - name: Install and Build
        run: |
          # العثور على المجلد الذي يحتوي على مشروعك
          PROJECT_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          echo "Project directory is: $PROJECT_DIR"
          cd $PROJECT_DIR
          
          # تثبيت التبعيات وبناء مشروع الويب
          npm install
          npm run build
          
          # تثبيت أداة الأيقونات
          npm install -g @capacitor/assets
          
          # تحميل الأيقونة (استبدل الرابط أدناه برابط صورتك)
          mkdir -p resources
          curl -L "https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/icon-only.png" -o resources/icon.png
          
          # إضافة منصة أندرويد وبناء الأيقونات
          npx cap add android || true
          npx capacitor-assets generate --android
          npx cap sync android
          
          # بناء ملف APK
          cd android
          ./gradlew assembleDebug
          
          # نقل ملف الـ APK لمكان معروف للرفع
          mkdir -p ../../output
          cp app/build/outputs/apk/debug/app-debug.apk ../../output/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-App-Debug-APK
          path: output/app-debug.apk
