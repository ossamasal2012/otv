name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # أزلت خاصية cache هنا لمنع الخطأ الذي ظهر في الصورة

      - name: Create Project and Sync
        run: |
          # 1. تهيئة بيئة Node
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
          # 2. تجهيز ملفات الويب (الموجودة حالياً في المستودع)
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          # إذا كان لديك ملفات CSS أو JS أخرى، سيتم نقلها أيضاً
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          
          # 3. بناء مشروع أندرويد من الصفر
          npx cap init "Ossama TV" "com.ossama.tv" --web-dir www
          npx cap add android

          # 4. إعداد الأيقونة (تأكد من وضع رابط صورتك هنا)
          mkdir -p resources
          curl -L "https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/icon-only.png" -o resources/icon.png
          
          # 5. توليد الأيقونات والمزامنة النهائية
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          # تنظيف وبناء بدون استخدام daemon لتقليل استهلاك الذاكرة
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ossama-TV-Final-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
