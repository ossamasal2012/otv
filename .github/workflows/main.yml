name: Build APK from index.html

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # تم تحديث النسخة إلى 17 لضمان التوافق التام مع Gradle وأندرويد
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Auto-Generate Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
          mkdir -p www
          # نستخدم علامة * لضمان نقل index.html وأي ملفات ترفعها لاحقاً
          cp -r * www/ 2>/dev/null || true
          
          npx cap init "Ossama App" "com.ossama.app" --web-dir www
          
          # مكان وضع رابط الأيقونة
          mkdir -p resources
          curl -L "https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/icon-only.png" -o resources/icon.png
          
          npx cap add android
          
          # توليد الأيقونات قبل المزامنة
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          # أمر لضمان استخدام Java 17 داخل Gradle
          ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME_17_X64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ossama-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
