name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # حل مشكلة Java: استخدام نسخة 17 المستقرة
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize and Build Project
        run: |
          # إنشاء بيئة العمل إذا لم تكن موجودة
          if [ ! -f "package.json" ]; then
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          fi
          
          # إنشاء مجلد الويب ونقل الملفات
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          
          # تهيئة كاباسيتور (يمكنك تغيير الاسم هنا)
          if [ ! -d "android" ]; then
            npx cap init "Ossama TV" "com.ossama.tv" --web-dir www
            npx cap add android
          fi

          # إعداد الأيقونة (استبدل الرابط أدناه برابط صورتك المباشر)
          mkdir -p resources
          curl -L "https://raw.githubusercontent.com/ionic-team/capacitor-assets/main/assets/icon-only.png" -o resources/icon.png
          
          # توليد الأيقونات والمزامنة
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ossama-TV-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
