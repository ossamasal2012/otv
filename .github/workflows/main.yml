name: Build Yalla Goal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize App Project & Capacitor
      run: |
        mkdir -p www
        cp index.html www/
        npm init -y
        # تثبيت الـ Dependencies الأساسية والـ Plugins لتخطي الـ CORS
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "يلا گول" "com.yallagoal.app" --web-dir=www
        npx cap add android

        # 1. التعديل الفوري لنسخة Gradle داخل المجلد فور إنشائه مباشرة إلى 8.7
        PROPERTIES_FILE="android/gradle/wrapper/gradle-wrapper.properties"
        if [ -f "$PROPERTIES_FILE" ]; then
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.7-all.zip/g' $PROPERTIES_FILE
          echo "==== تم تحديث ملف الخصائص بنجاح إلى إصدار 8.7 ===="
        fi

        # 2. الحل السحري لخطأ الفانيلا: رفع الـ SDK إلى إصدار 35 ليدعم أندرويد 15 بالكامل
        VARIABLES_FILE="android/variables.gradle"
        if [ -f "$VARIABLES_FILE" ]; then
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/g' $VARIABLES_FILE
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/g' $VARIABLES_FILE
          echo "==== تم تحديث الـ SDK إلى إصدار 35 بنجاح ===="
        fi

        # 3. توحيد وإجبار إصدار كوتلن لمنع خطأ الملفات المكررة (Duplicate Classes) عبر printf الآمنة
        BUILD_FILE="android/build.gradle"
        if [ -f "$BUILD_FILE" ]; then
          sed -i 's/ext {/ext {\n        kotlinVersion = "1.9.22"/g' $BUILD_FILE
          
          # ضخ كوتلن الموحد بطريقة تمنع أخطاء الـ Syntax نهائياً
          printf "\nsubprojects {\n    project.configurations.all {\n        resolutionStrategy.eachDependency { details ->\n            if (details.requested.group == 'org.jetbrains.kotlin') {\n                details.useVersion '1.9.22'\n            }\n        }\n    }\n}\n" >> $BUILD_FILE
          echo "==== تم توحيد إصدار كوتلن بنجاح لمنع التكرار ===="
        fi

    - name: Configure Fullscreen & Disable Default Splash Screen
      run: |
        # تعديل ملف الإعدادات لتعطيل الـ Splash الافتراضية البيضاء
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.yallagoal.app",
          "appName": "يلا گول",
          "webDir": "www",
          "server": {
            "androidScheme": "https",
            "allowNavigation": ["*"]
          },
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 0,
              "launchAutoHide": true
            }
          }
        }
        EOF

        # تعديل كود الـ Java الرئيسي في الأندرويد لإخفاء أشرطة النظام والإشعارات فوراً (ملء الشاشة الحقيقي لجميع الإصدارات)
        MAIN_ACTIVITY="android/app/src/main/java/com/yallagoal/app/MainActivity.java"
        cat <<'EOF' > $MAIN_ACTIVITY
        package com.yallagoal.app;

        import android.os.Build;
        import android.os.Bundle;
        import android.view.View;
        import android.view.WindowInsets;
        import android.view.WindowInsetsController;
        import android.view.WindowManager;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                // 1. إخفاء شريط الحالة العلوي بالطريقة العامة
                getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                    WindowManager.LayoutParams.FLAG_FULLSCREEN);
                
                // 2. التحكم الشامل بملء الشاشة حسب إصدار الأندرويد
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                    // الأنظمة الحديثة (أندرويد 11، 12، 13، 14، 15+)
                    final WindowInsetsController controller = getWindow().getInsetsController();
                    if (controller != null) {
                        // إخفاء شريط الإشعارات وشريط التنقل/الإيماءات السفلي تماماً
                        controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                        // جعل الإخفاء ثابتاً بحيث لا يظهر إلا بسحب المستخدم للشاشة من الحافة (Sticky)
                        controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                    }
                } else {
                    // الأنظمة القديمة (أندرويد 10 وما قبله)
                    View decorView = getWindow().getDecorView();
                    int uiOptions = View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY;
                    decorView.setSystemUiVisibility(uiOptions);
                }
            }
            
            // إعادة تطبيق الاختفاء التلقائي حتى لو خرج المستخدم من التطبيق وعاد إليه
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
                super.onWindowFocusChanged(hasFocus);
                if (hasFocus) {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                        final WindowInsetsController controller = getWindow().getInsetsController();
                        if (controller != null) {
                            controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                        }
                    } else {
                        getWindow().getDecorView().setSystemUiVisibility(
                            View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                            View.SYSTEM_UI_FLAG_FULLSCREEN |
                            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                        );
                    }
                }
            }
        }
        EOF

        # السماح بطلب بيانات الـ HTTP والـ Internet في ملف الـ AndroidManifest
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

    - name: Download & Apply App Custom Icon
      run: |
        curl -L -o app_icon.png "https://raw.githubusercontent.com/ossamasal2012/otv/main/icon.png"
        npm install -g @capacitor/assets
        mkdir -p assets
        cp app_icon.png assets/icon.png
        npx capacitor-assets generate --android

    - name: Sync Capacitor Project
      run: |
        npx cap sync android

    - name: Build Android APK (Release)
      run: |
        cd android
        chmod +x ./gradlew
        # البناء الآن سيقوم بتحميل إصدار 8.7 المستقر مباشرة ويتخطى المشكلة
        ./gradlew assembleDebug --no-daemon --no-build-cache

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yalla-Goal-Premium-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
