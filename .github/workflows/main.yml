name: Build Android APK (Yalla Goal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install @capacitor/android @capacitor/http
          # إنشاء مجلد الويب ونسخ ملفك إليه
          mkdir -p www
          cp index.html www/

      - name: Initialize Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.ossama.yallagoal",
            "appName": "Yalla Goal",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"]
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions & Style
        run: |
          # 1. إضافة صلاحيات الإنترنت في الـ Manifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          
          # 2. السماح بمرور روابط HTTP غير المشفرة
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          # 3. جعل خلفية النشاط الرئيسي سوداء بالكامل (True Black)
          sed -i 's/android:theme="@style/android:theme="@android:style\/Theme.Black.NoTitleBar.Fullscreen"/' android/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Android APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yalla-Goal-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
