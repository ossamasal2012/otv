name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: 🖼️ Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ══════════════════════════════════════════
      # الخطوة 1 — تجهيز ملفات الويب (Yalla Goal)
      # ══════════════════════════════════════════
      - name: 🗂️ Create Project & www
        run: |
          mkdir -p yalla-goal/www
          # جلب ملف index.html
          if [ -f "yallagoal.html" ]; then
            cp yallagoal.html yalla-goal/www/index.html
          elif [ -f "index.html" ]; then
            cp index.html yalla-goal/www/index.html
          else
            echo "❌ ملف HTML غير موجود!" && exit 1
          fi

          cat > yalla-goal/package.json << 'EOF'
          {
            "name": "yalla-goal",
            "version": "2.7.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

      - name: 📥 Install Dependencies
        run: |
          cd yalla-goal
          npm install

      - name: ⚙️ Capacitor Config (CORS & Navigation)
        run: |
          cat > yalla-goal/capacitor.config.json << 'EOF'
          {
            "appId": "com.yallagoal.app",
            "appName": "Yalla Goal",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: 🤖 Add Android Platform
        run: |
          cd yalla-goal
          npx cap add android

      # ══════════════════════════════════════════
      # الخطوة 2 — حل مشكلة التضارب (Duplicate Class)
      # ══════════════════════════════════════════
      - name: 🔄 Capacitor Sync & Dependency Fix
        run: |
          cd yalla-goal
          npx cap sync android
          
          # تعديل ملف build.gradle الرئيسي لحل تضارب Kotlin
          GRADLE_APP="android/app/build.gradle"
          cat >> "$GRADLE_APP" << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
              }
          }
          EOF

      # ══════════════════════════════════════════
      # الخطوة 3 — إعدادات الإنترنت والأمان (AndroidManifest)
      # ══════════════════════════════════════════
      - name: 📡 Network & Permissions Config
        run: |
          # 1. Network Security Config
          mkdir -p yalla-goal/android/app/src/main/res/xml
          cat > yalla-goal/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          # 2. AndroidManifest (Internet & Full permissions)
          cat > yalla-goal/android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="يلا گول"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="يلا گول"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # ══════════════════════════════════════════
      # الخطوة 4 — معالجة الأيقونة (App Icon)
      # ══════════════════════════════════════════
      - name: 🖼️ Generate App Icons
        run: |
          # استبدل هذا الرابط برابط أيقونتك الخاصة أو ضع ملف باسم icon.png في المستودع
          curl -L "https://cdn-icons-png.flaticon.com/512/5323/5323977.png" -o /tmp/icon.png
          BASE="yalla-goal/android/app/src/main/res"
          
          declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
          
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            mkdir -p "$BASE/$DIR"
            # أيقونة مربعة
            convert /tmp/icon.png -resize ${SIZE}x${SIZE}^ -gravity center -extent ${SIZE}x${SIZE} -background "#020617" "$BASE/$DIR/ic_launcher.png"
            # أيقونة دائرية
            convert /tmp/icon.png -resize ${SIZE}x${SIZE}^ -gravity center -extent ${SIZE}x${SIZE} -background "#020617" "$BASE/$DIR/ic_launcher_round.png"
          done

      - name: 🔐 Grant Gradle Permission
        run: chmod +x yalla-goal/android/gradlew

      - name: 🏗️ Build Final APK
        run: |
          cd yalla-goal/android
          ./gradlew assembleDebug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-Stable-v2.7
          path: yalla-goal/android/app/build/outputs/apk/debug/app-debug.apk
