name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# تحديد المجلد الافتراضي الذي يحتوي على الكود (المجلد الفرعي otv)
defaults:
  run:
    working-directory: otv

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor Assets Tool
        run: npm install -g @capacitor/assets

      - name: Build Web Project
        run: npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Add Android Platform
        run: npx cap add android

      - name: Download and Set App Icon
        run: |
          mkdir -p resources
          # ضع رابط صورتك هنا
          curl -L "رابط_صورتك_هنا" -o resources/icon.png
          capacitor-assets generate --android

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-App-Debug-APK
          # التأكد من المسار الصحيح للرفع مع المجلد الفرعي
          path: otv/android/app/build/outputs/apk/debug/app-debug.apk
