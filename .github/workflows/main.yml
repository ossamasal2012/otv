          mkdir -p cap-project/android/app/src/main/res/values-v30
          cat > cap-project/android/app/src/main/res/values-v30/fullscreen_themes.xml << 'THEME30'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
