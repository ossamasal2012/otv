name: Build Signed APK - OTV App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # السماح بالتشغيل اليدوي

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      # ===========================
      # 1. استنساخ الكود
      # ===========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ===========================
      # 2. إعداد Node.js
      # ===========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ===========================
      # 3. إعداد Java (مطلوب لـ Android)
      # ===========================
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ===========================
      # 4. إعداد Android SDK
      # ===========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ===========================
      # 5. تثبيت الحزم
      # ===========================
      - name: Install Dependencies
        run: npm install

      # ===========================
      # 6. تثبيت Capacitor CLI
      # ===========================
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      # ===========================
      # 7. بناء ملفات الويب (HTML/CSS/JS)
      # ===========================
      - name: Build Web Assets
        run: |
          # إذا كنت تستخدم Vite أو Webpack أو غيره، استبدل هذا السطر
          # npm run build
          
          # للملف HTML الواحد (index.html) → انسخه إلى مجلد dist
          mkdir -p dist
          cp index.html dist/index.html
          # أضف أي ملفات إضافية هنا إذا لزم الأمر
          # cp -r assets dist/assets

      # ===========================
      # 8. مزامنة Capacitor مع Android
      # ===========================
      - name: Capacitor Sync
        run: npx cap sync android

      # ===========================
      # 9. تنزيل أيقونة التطبيق
      # ===========================
      - name: Download & Set App Icon
        run: |
          # ▶▶▶ ضع رابط الأيقونة هنا (PNG بحجم 1024x1024 على الأقل) ◀◀◀
          ICON_URL="https://i.ibb.co/fYkRx1fB/Gemini-Generated-Image-ekxxfoekxxfoekxx.png"
          
          # تنزيل الأيقونة
          curl -L "$ICON_URL" -o app_icon.png
          
          # إنشاء مجلدات الأيقونات بأحجام مختلفة لـ Android
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          # تغيير حجم الأيقونة (يتطلب ImageMagick)
          sudo apt-get install -y imagemagick
          
          convert app_icon.png -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert app_icon.png -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert app_icon.png -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert app_icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert app_icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          # نسخ الأيقونة المستديرة (Round Icons)
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png    android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png    android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png   android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png  android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          echo "✅ تم تحديث أيقونة التطبيق بنجاح"

      # ===========================
      # 10. منح صلاحيات Gradle
      # ===========================
      - name: Grant Gradle Execute Permissions
        run: chmod +x android/gradlew

      # ===========================
      # 11. بناء APK (بدون توقيع أولاً)
      # ===========================
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # ===========================
      # 12. فك تشفير Keystore من Secrets
      # ===========================
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          echo "✅ تم فك تشفير Keystore"

      # ===========================
      # 13. توقيع APK رقمياً
      # ===========================
      - name: Sign APK
        run: |
          # مسار APK غير الموقع
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/OTV-signed.apk"
          
          # التحقق من وجود الملف
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="android/app/build/outputs/apk/release/app-release.apk"
          fi
          
          # توقيع APK باستخدام apksigner
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks android/app/keystore.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
          
          echo "✅ تم توقيع APK بنجاح: $SIGNED_APK"

      # ===========================
      # 14. التحقق من التوقيع
      # ===========================
      - name: Verify APK Signature
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify \
            android/app/build/outputs/apk/release/OTV-signed.apk
          echo "✅ التوقيع صحيح وصالح"

      # ===========================
      # 15. رفع APK الموقع كـ Artifact
      # ===========================
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OTV-App-Signed
          path: android/app/build/outputs/apk/release/OTV-signed.apk
          retention-days: 30

      # ===========================
      # 16. إنشاء Release تلقائي (اختياري)
      # ===========================
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "OTV App v${{ github.run_number }}"
          body: |
            ## 📱 OTV Live TV - الإصدار ${{ github.run_number }}
            
            ### تعليمات التثبيت:
            1. قم بتنزيل ملف APK
            2. فعّل "مصادر غير معروفة" في إعدادات هاتفك
            3. ثبّت التطبيق
            
            ### ملاحظات:
            - هذا التطبيق موقع رقمياً ويمكن تثبيته بأمان
            - يدعم بث مباشر بجودة عالية
          files: android/app/build/outputs/apk/release/OTV-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
