name: Build APK from HTML

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 تحميل المشروع
        uses: actions/checkout@v3

      - name: ⚙️ تثبيت Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 تثبيت Cordova
        run: npm install -g cordova

      - name: 📁 إنشاء مشروع Cordova
        run: |
          cordova create app com.otv.app OTV
          cd app
          cordova platform add android

      - name: 📂 نسخ index.html
        run: |
          cp index.html app/www/index.html

      - name: 🔨 بناء APK
        run: |
          cd app
          cordova build android

      - name: 📤 رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: OTV-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
