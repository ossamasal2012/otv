name: 🏗️ Build Yalla Goal APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Build Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools"

      # ─── تثبيت ImageMagick لتوليد الأيقونات ───
      - name: 🖼️ Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: 🗂️ Create Project Structure
        run: |
          mkdir -p yalla-goal/www
          cp index.html yalla-goal/www/index.html
          cat > yalla-goal/package.json << 'EOF'
          {
            "name": "yalla-goal",
            "version": "2.3.0",
            "scripts": { "build": "echo ok" }
          }
          EOF

      - name: 📥 Install Capacitor
        run: |
          cd yalla-goal
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ⚙️ Create Capacitor Config
        run: |
          cat > yalla-goal/capacitor.config.json << 'EOF'
          {
            "appId": "com.yallagoal.app",
            "appName": "YallaGoal",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: 🤖 Add Android Platform
        run: |
          cd yalla-goal
          npx cap add android

      # ══════════════════════════════════════════
      # 🖼️ توليد أيقونات التطبيق بجميع الأحجام
      # ══════════════════════════════════════════
      - name: 🖼️ Download & Generate App Icons
        run: |
          # تحميل الأيقونة الأصلية
          curl -L "https://i.ibb.co/CKJ5NVv7/Screenshot-2026-04-21-1-52-19-PM.png" \
            -o /tmp/icon_original.png

          echo "✅ Icon downloaded: $(identify /tmp/icon_original.png)"

          # مسارات أيقونات Android
          BASE="yalla-goal/android/app/src/main/res"

          # أحجام mipmap القياسية
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            mkdir -p "$BASE/$DIR"

            # ic_launcher (مربع)
            convert /tmp/icon_original.png \
              -resize ${SIZE}x${SIZE} \
              -gravity center \
              -background "#020617" \
              -extent ${SIZE}x${SIZE} \
              "$BASE/$DIR/ic_launcher.png"

            # ic_launcher_round (دائري)
            convert /tmp/icon_original.png \
              -resize ${SIZE}x${SIZE} \
              \( +clone \
                -threshold -1 \
                -negate \
                -fill white \
                -draw "circle $((SIZE/2)),$((SIZE/2)) $((SIZE/2)),0" \
              \) \
              -alpha off \
              -compose CopyOpacity \
              -composite \
              -background "#020617" \
              -alpha remove \
              "$BASE/$DIR/ic_launcher_round.png"

            echo "  ✅ $DIR: ${SIZE}x${SIZE}px"
          done

          # أيقونة foreground لـ Adaptive Icons
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            BG_SIZE=$((SIZE * 108 / 72))
            convert /tmp/icon_original.png \
              -resize ${SIZE}x${SIZE} \
              -gravity center \
              -background none \
              -extent ${BG_SIZE}x${BG_SIZE} \
              "$BASE/$DIR/ic_launcher_foreground.png" 2>/dev/null || true
          done

          echo "✅ جميع الأيقونات تم توليدها"

      # ══════════════════════════════════════════
      # 🌐 Network Security Config
      # ══════════════════════════════════════════
      - name: 🌐 Create Network Security Config
        run: |
          mkdir -p yalla-goal/android/app/src/main/res/xml
          cat > yalla-goal/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system"/>
                      <certificates src="user"/>
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      # ══════════════════════════════════════════
      # 📝 AndroidManifest.xml
      # ══════════════════════════════════════════
      - name: 📝 Write AndroidManifest.xml
        run: |
          cat > yalla-goal/android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

      # ══════════════════════════════════════════
      # 🛡️ MainActivity مع أقوى حل CORS
      # ══════════════════════════════════════════
      - name: 🛠️ Write MainActivity.java (Enhanced CORS)
        run: |
          MAIN_ACTIVITY=$(find yalla-goal/android -name "MainActivity.java" | head -1)
          PACKAGE=$(grep -m1 "^package" "$MAIN_ACTIVITY" | sed 's/package //;s/;//' | tr -d '[:space:]')
          echo "Package: [$PACKAGE]"

          cat > "$MAIN_ACTIVITY" << JAVAEOF
          package ${PACKAGE};

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          import java.io.IOException;
          import java.util.HashMap;
          import java.util.Map;

          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;

          public class MainActivity extends BridgeActivity {

              @Override
              @SuppressLint("SetJavaScriptEnabled")
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  fixWebViewSettings();
              }

              private void fixWebViewSettings() {
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView == null) return;

                      WebSettings s = webView.getSettings();

                      // ── JavaScript & Storage ──
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setDatabaseEnabled(true);

                      // ── CORS: أقوى إعداد ممكن ──
                      s.setAllowFileAccess(true);
                      s.setAllowContentAccess(true);
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);

                      // ── HTTP داخل HTTPS (Mixed Content) ──
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                      // ── الوسائط والفيديو ──
                      s.setMediaPlaybackRequiresUserGesture(false);
                      s.setLoadWithOverviewMode(true);
                      s.setUseWideViewPort(true);

                      // ── Cache ──
                      s.setCacheMode(WebSettings.LOAD_DEFAULT);

                      // ── User-Agent: متصفح حقيقي لتجاوز قيود البث ──
                      s.setUserAgentString(
                          "Mozilla/5.0 (Linux; Android 13; Pixel 7) " +
                          "AppleWebKit/537.36 (KHTML, like Gecko) " +
                          "Chrome/120.0.0.0 Mobile Safari/537.36"
                      );

                      // ── WebChromeClient: دعم كامل للفيديو والشاشة الكاملة ──
                      webView.setWebChromeClient(new WebChromeClient());

                      // ── WebViewClient: إضافة CORS headers لكل طلب ──
                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              // السماح بكل الروابط داخل WebView
                              return false;
                          }

                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              // إضافة CORS headers لطلبات m3u8 و ts
                              String url = request.getUrl().toString();
                              if (url.contains(".m3u8") || url.contains(".ts") || url.contains(".m3u")) {
                                  try {
                                      okhttp3.OkHttpClient client = new okhttp3.OkHttpClient();
                                      okhttp3.Request.Builder reqBuilder = new okhttp3.Request.Builder().url(url);

                                      // نسخ headers الأصلية مع إضافة Origin
                                      for (Map.Entry<String, String> entry : request.getRequestHeaders().entrySet()) {
                                          reqBuilder.addHeader(entry.getKey(), entry.getValue());
                                      }
                                      reqBuilder.addHeader("Origin", "https://www.google.com");
                                      reqBuilder.addHeader("Referer", "https://www.google.com/");

                                      okhttp3.Response response = client.newCall(reqBuilder.build()).execute();

                                      Map<String, String> responseHeaders = new HashMap<>();
                                      responseHeaders.put("Access-Control-Allow-Origin", "*");
                                      responseHeaders.put("Access-Control-Allow-Methods", "GET, POST, OPTIONS");
                                      responseHeaders.put("Access-Control-Allow-Headers", "*");

                                      String contentType = response.header("Content-Type", "application/vnd.apple.mpegurl");
                                      String mimeType = contentType.split(";")[0].trim();

                                      return new WebResourceResponse(
                                          mimeType,
                                          "UTF-8",
                                          response.code(),
                                          "OK",
                                          responseHeaders,
                                          response.body().byteStream()
                                      );
                                  } catch (Exception e) {
                                      e.printStackTrace();
                                  }
                              }
                              return super.shouldInterceptRequest(view, request);
                          }
                      });

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          JAVAEOF

      # ─── إضافة OkHttp dependency ───
      - name: 📦 Add OkHttp to app/build.gradle
        run: |
          APP_GRADLE="yalla-goal/android/app/build.gradle"

          # إضافة OkHttp + حل Kotlin stdlib
          cat >> "$APP_GRADLE" << 'EOF'

          dependencies {
              implementation "com.squareup.okhttp3:okhttp:4.12.0"
          }

          // ─── حل تعارض Kotlin stdlib ───
          configurations.all {
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
                  force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.0"
              }
          }
          EOF

      - name: 🔄 Sync Capacitor
        run: |
          cd yalla-goal
          npx cap sync android

      - name: 🔐 Grant Gradle Permission
        run: chmod +x yalla-goal/android/gradlew

      - name: 🏗️ Build Debug APK
        run: |
          cd yalla-goal/android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "══════════════════════════════════════"
            echo "❌ الخطأ الحقيقي:"
            grep -A 5 "What went wrong\|error:\|Caused by" /tmp/gradle_output.txt | head -40
            echo "══════════════════════════════════════"
            exit 1
          fi

      - name: 🔍 Find APK
        run: |
          APK_PATH=$(find yalla-goal/android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then echo "❌ APK not found!"; exit 1; fi
          echo "✅ APK: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaGoal-v2.3-debug
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: 📋 Upload Gradle Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle_output.txt
          retention-days: 7

      - name: ✅ Build Summary
        run: |
          echo "=========================================="
          echo "✅ يلا گول APK جاهز!"
          echo "🖼️  الأيقونة: مخصصة بجميع الأحجام"
          echo "☕ Java: 21"
          echo "🔧 Kotlin stdlib: موحّد 1.9.0"
          echo "🌐 CORS: مُحلول بـ OkHttp interceptor"
          echo "📡 HTTP + HTTPS: مدعوم"
          echo "🎬 HLS / M3U8: مدعوم"
          echo "=========================================="
