name: Build يلا گول APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Java 21
      # ─────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ─────────────────────────────────────────────
      # 3. Node.js 22
      # ─────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ─────────────────────────────────────────────
      # 4. Android SDK
      # ─────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      # ─────────────────────────────────────────────
      # 5. تثبيت Capacitor
      # ─────────────────────────────────────────────
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@latest

      # ─────────────────────────────────────────────
      # 6. تجهيز مشروع Capacitor
      # ─────────────────────────────────────────────
      - name: Initialise Capacitor project
        run: |
          mkdir -p cap-project/www
          cd cap-project

          cat > package.json << 'PKG'
          {
            "name": "yalla-gol",
            "version": "1.0.0",
            "description": "يلا گول - M3U Streaming Player",
            "main": "index.js",
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/app": "^6.0.0"
            }
          }
          PKG

          npm install

          cat > capacitor.config.json << 'CAP'
          {
            "appId": "com.yallagol.app",
            "appName": "يلا گول",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            },
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            }
          }
          CAP

      # ─────────────────────────────────────────────
      # 7. نسخ index.html → www/
      # ─────────────────────────────────────────────
      - name: Copy web assets
        run: |
          if [ -f "index.html" ]; then
            cp index.html cap-project/www/index.html
          fi
          # نسخ أي assets أخرى (css, js, images)
          for f in *.css *.js *.png *.jpg *.svg; do
            [ -f "$f" ] && cp "$f" cap-project/www/ 2>/dev/null || true
          done
          ls -la cap-project/www/

      # ─────────────────────────────────────────────
      # 8. أيقونة التطبيق (مضمّنة كـ base64)
      # ─────────────────────────────────────────────
