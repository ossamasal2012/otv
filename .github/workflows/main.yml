      # ─────────────────────────────────────────────
      # 14. MainActivity.java
      #     - Fullscreen Immersive (API 16-29 + API 30+)
      #     - WebView settings كاملة
      #     - CORSWebViewClient مدمج
      # ─────────────────────────────────────────────
      - name: Write MainActivity.java with CORS + Fullscreen
        run: |
          MAIN=$(find cap-project/android -name "MainActivity.java" | head -1)
          PKG_DIR=$(dirname "$MAIN")
          echo "Writing to: $MAIN"

          cat > "$MAIN" << 'JAVA'
          package com.yallagol.app;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.io.InputStream;
          import java.io.ByteArrayInputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends BridgeActivity {

            @Override
            public void onCreate(Bundle savedInstanceState) {
              // إخفاء شريط العنوان قبل super
              requestWindowFeature(Window.FEATURE_NO_TITLE);
              getWindow().setFlags(
                WindowManager.LayoutParams.FLAG_FULLSCREEN,
                WindowManager.LayoutParams.FLAG_FULLSCREEN
              );
              super.onCreate(savedInstanceState);
              applyImmersiveFullscreen();
              setupWebView();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) applyImmersiveFullscreen();
            }

            @Override
            public void onResume() {
              super.onResume();
              applyImmersiveFullscreen();
            }

            // ── Fullscreen لكل إصدارات Android ──────────────────────
            private void applyImmersiveFullscreen() {
              Window window = getWindow();
              window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                // Android 11+ (API 30+)
                window.setDecorFitsSystemWindows(false);
                WindowInsetsController ctrl = window.getInsetsController();
                if (ctrl != null) {
                  ctrl.hide(
                    WindowInsets.Type.statusBars() |
                    WindowInsets.Type.navigationBars() |
                    WindowInsets.Type.systemBars()
                  );
                  ctrl.setSystemBarsBehavior(
                    WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  );
                }
                window.setStatusBarColor(Color.TRANSPARENT);
                window.setNavigationBarColor(Color.TRANSPARENT);
              } else {
                // Android 4.1 - 10 (API 16-29)
                View decorView = window.getDecorView();
                int flags = View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_FULLSCREEN;
                decorView.setSystemUiVisibility(flags);
              }

              // Notch / Display Cutout (API 28+)
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                WindowManager.LayoutParams params = window.getAttributes();
                params.layoutInDisplayCutoutMode =
                  WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                window.setAttributes(params);
              }
            }

            // ── WebView إعدادات شاملة ────────────────────────────────
            private void setupWebView() {
              try {
                WebView webView = getBridge().getWebView();
                WebSettings s = webView.getSettings();

                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setDatabaseEnabled(true);
                s.setAllowFileAccess(true);
                s.setAllowContentAccess(true);
                // هذان السطران هما المفتاح الحقيقي لـ CORS داخل APK
                s.setAllowFileAccessFromFileURLs(true);
                s.setAllowUniversalAccessFromFileURLs(true);
                s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                s.setMediaPlaybackRequiresUserGesture(false);
                s.setLoadWithOverviewMode(true);
                s.setUseWideViewPort(true);
                s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                s.setBuiltInZoomControls(false);
                s.setSupportZoom(false);
                s.setTextZoom(100);
                s.setUserAgentString(
                  "Mozilla/5.0 (Linux; Android 11; Mobile) " +
                  "AppleWebKit/537.36 (KHTML, like Gecko) " +
                  "Chrome/120.0.0.0 Mobile Safari/537.36"
                );

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                  android.webkit.CookieManager cm =
                    android.webkit.CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(webView, true);
                }

                // ربط WebViewClient المخصص للـ CORS
                getBridge().setWebViewClient(new CORSBypassClient(getBridge()));

              } catch (Exception e) {
                e.printStackTrace();
              }
            }

            // ── CORS Bypass Client ─────────────────────────────────
            // يعترض كل طلب HTTP على مستوى Android Native
            // ويضيف Headers الـ CORS يدوياً — هذا هو الحل الوحيد الصحيح داخل APK
            class CORSBypassClient extends BridgeWebViewClient {

              CORSBypassClient(com.getcapacitor.Bridge bridge) {
                super(bridge);
              }

              @Override
              public WebResourceResponse shouldInterceptRequest(
                  WebView view, WebResourceRequest request) {

                String url = request.getUrl().toString();
                String method = request.getMethod();

                // OPTIONS preflight → ردّ فوري بـ CORS headers
                if ("OPTIONS".equalsIgnoreCase(method)) {
                  return buildCORSResponse(null, "text/plain", 204);
                }

                // تجاوز الموارد المحلية (capacitor://, file://, data:)
                if (!url.startsWith("http://") && !url.startsWith("https://")) {
                  return super.shouldInterceptRequest(view, request);
                }

                // تجاوز طلبات capacitor نفسه
                if (url.contains("capacitor://") || url.contains("localhost")) {
                  return super.shouldInterceptRequest(view, request);
                }

                try {
                  HttpURLConnection conn = (HttpURLConnection)
                    new URL(url).openConnection();
                  conn.setRequestMethod(method);
                  conn.setConnectTimeout(20000);
                  conn.setReadTimeout(20000);
                  conn.setInstanceFollowRedirects(true);
                  conn.setDoInput(true);

                  // نقل headers الأصلية
                  for (Map.Entry<String, String> h :
                       request.getRequestHeaders().entrySet()) {
                    String key = h.getKey();
                    // تجاوز الـ headers التي تسبب مشاكل
                    if (!key.equalsIgnoreCase("Origin") &&
                        !key.equalsIgnoreCase("Referer")) {
                      conn.setRequestProperty(key, h.getValue());
                    }
                  }
                  conn.setRequestProperty("User-Agent",
                    "Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36");
                  conn.setRequestProperty("Accept", "*/*");
                  conn.setRequestProperty("Accept-Encoding", "identity");

                  conn.connect();

                  int status = conn.getResponseCode();
                  if (status < 0) status = 200;

                  InputStream stream;
                  try {
                    stream = conn.getInputStream();
                  } catch (Exception ex) {
                    stream = conn.getErrorStream();
                    if (stream == null) {
                      stream = new ByteArrayInputStream(new byte[0]);
                    }
                  }

                  String mimeType = conn.getContentType();
                  if (mimeType == null) mimeType = guessMime(url);
                  if (mimeType.contains(";"))
                    mimeType = mimeType.split(";")[0].trim();

                  return buildCORSResponse(stream, mimeType, status);

                } catch (Exception e) {
                  // fallback: اتركه للـ WebView الأصلي
                  return super.shouldInterceptRequest(view, request);
                }
              }

              private WebResourceResponse buildCORSResponse(
                  InputStream stream, String mime, int status) {
                Map<String, String> headers = new HashMap<>();
                headers.put("Access-Control-Allow-Origin", "*");
                headers.put("Access-Control-Allow-Methods",
                  "GET, POST, PUT, DELETE, HEAD, OPTIONS");
                headers.put("Access-Control-Allow-Headers", "*");
                headers.put("Access-Control-Expose-Headers", "*");
                headers.put("Access-Control-Max-Age", "86400");
                if (stream == null)
                  stream = new ByteArrayInputStream(new byte[0]);
                String reason = (status >= 200 && status < 300) ? "OK" : "Error";
                return new WebResourceResponse(
                  mime, "utf-8", status, reason, headers, stream);
              }

              private String guessMime(String url) {
                url = url.toLowerCase();
                if (url.contains(".m3u8")) return "application/vnd.apple.mpegurl";
                if (url.contains(".m3u"))  return "audio/x-mpegurl";
                if (url.contains(".ts"))   return "video/MP2T";
                if (url.contains(".mp4"))  return "video/mp4";
                if (url.contains(".json")) return "application/json";
                if (url.contains(".xml"))  return "text/xml";
                return "application/octet-stream";
              }
            }
          }
          JAVA

          echo "✅ MainActivity.java written"
          wc -l "$MAIN"

      # ─────────────────────────────────────────────
      # 15. تصحيح package name في MainActivity
      # ─────────────────────────────────────────────
      - name: Fix package name in MainActivity
        run: |
          MAIN=$(find cap-project/android -name "MainActivity.java" | head -1)
          # الحصول على الـ package الفعلي من المشروع
          ACTUAL_PKG=$(grep -r "applicationId" cap-project/android/app/build.gradle \
            | grep -o '"[^"]*"' | tr -d '"' | head -1)
          echo "Actual package: $ACTUAL_PKG"
          if [ -n "$ACTUAL_PKG" ] && [ "$ACTUAL_PKG" != "com.yallagol.app" ]; then
            sed -i "s|package com.yallagol.app;|package $ACTUAL_PKG;|g" "$MAIN"
            echo "✅ Package updated to: $ACTUAL_PKG"
          fi

          # تحديث applicationId في build.gradle
          sed -i 's|applicationId "[^"]*"|applicationId "com.yallagol.app"|' \
            cap-project/android/app/build.gradle || true

      # ─────────────────────────────────────────────
      # 16. strings.xml — اسم التطبيق
      # ─────────────────────────────────────────────
      - name: Set app name to يلا گول
        run: |
          STRINGS="cap-project/android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">يلا گول</string>|' \
              "$STRINGS"
          else
            mkdir -p "$(dirname $STRINGS)"
            cat > "$STRINGS" << 'STR'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">يلا گول</string>
          </resources>
          STR
          fi
          echo "✅ App name set to يلا گول"

      # ─────────────────────────────────────────────
      # 17. مزامنة Capacitor
      # ─────────────────────────────────────────────
      - name: Sync Capacitor
        working-directory: cap-project
        run: npx cap sync android

      # ─────────────────────────────────────────────
      # 18. تصحيح Java compatibility في build.gradle
      # ─────────────────────────────────────────────
      - name: Fix Java compatibility in build.gradle
        run: |
          find cap-project/android -name "build.gradle" | while read f; do
            sed -i "s|JavaVersion.VERSION_[0-9_]*|JavaVersion.VERSION_21|g" "$f"
          done
          # زيادة ذاكرة Gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" \
            >> cap-project/android/gradle.properties
          echo "android.useAndroidX=true" \
            >> cap-project/android/gradle.properties
          echo "✅ build.gradle fixed"

      # ─────────────────────────────────────────────
      # 19. صلاحيات Gradle wrapper
      # ─────────────────────────────────────────────
      - name: Fix Gradle wrapper permissions
        run: chmod +x cap-project/android/gradlew

      # ─────────────────────────────────────────────
      # 20. بناء APK
      # ─────────────────────────────────────────────
      - name: Build APK (Debug)
        working-directory: cap-project/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ─────────────────────────────────────────────
      # 21. إعادة تسمية APK
      # ─────────────────────────────────────────────
      - name: Rename APK
        run: |
          mv cap-project/android/app/build/outputs/apk/debug/app-debug.apk \
             cap-project/android/app/build/outputs/apk/debug/yalla-gol.apk || true

      # ─────────────────────────────────────────────
      # 22. رفع APK
      # ─────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yalla-gol-apk
          path: cap-project/android/app/build/outputs/apk/debug/yalla-gol.apk
          retention-days: 30
