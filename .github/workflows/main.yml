      # ─────────────────────────────────────────────
      # 9. إضافة Android Platform
      # ─────────────────────────────────────────────
      - name: Add Android platform
        working-directory: cap-project
        run: npx cap add android

      # ─────────────────────────────────────────────
      # 10. إعداد أيقونات Android بجميع الأحجام
      # ─────────────────────────────────────────────
      - name: Generate Android icons
        run: |
          sudo apt-get install -y imagemagick -q

          ICON_SRC="cap-project/www/icons/icon.png"
          MIPMAP_BASE="cap-project/android/app/src/main/res"

          if [ -f "$ICON_SRC" ]; then
            declare -A SIZES=(
              ["mipmap-mdpi"]=48
              ["mipmap-hdpi"]=72
              ["mipmap-xhdpi"]=96
              ["mipmap-xxhdpi"]=144
              ["mipmap-xxxhdpi"]=192
            )
            for dir in "${!SIZES[@]}"; do
              size="${SIZES[$dir]}"
              mkdir -p "$MIPMAP_BASE/$dir"
              convert "$ICON_SRC" -resize "${size}x${size}" \
                "$MIPMAP_BASE/$dir/ic_launcher.png"
              convert "$ICON_SRC" -resize "${size}x${size}" \
                "$MIPMAP_BASE/$dir/ic_launcher_round.png"
            done
            echo "✅ Icons generated"
          else
            echo "⚠️ Skipping icon generation"
          fi

      # ─────────────────────────────────────────────
      # 11. AndroidManifest.xml
      # ─────────────────────────────────────────────
      - name: Patch AndroidManifest.xml
        run: |
          MANIFEST="cap-project/android/app/src/main/AndroidManifest.xml"

          # أضف الصلاحيات (Capacitor يضيف INTERNET مسبقاً لذا نتحقق أولاً)
          if ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />|' "$MANIFEST"
          fi

          # usesCleartextTraffic + networkSecurityConfig
          sed -i 's|android:label="@string/app_name"|android:label="@string/app_name"\n        android:usesCleartextTraffic="true"\n        android:networkSecurityConfig="@xml/network_security_config"|' "$MANIFEST"

          # Fullscreen theme
          sed -i 's|android:theme="@style/AppTheme"|android:theme="@style/FullscreenTheme"|' "$MANIFEST"

          echo "✅ Manifest patched"
          cat "$MANIFEST"

      # ─────────────────────────────────────────────
      # 12. network_security_config.xml
      # ─────────────────────────────────────────────
      - name: Create network_security_config.xml
        run: |
          mkdir -p cap-project/android/app/src/main/res/xml
          cat > cap-project/android/app/src/main/res/xml/network_security_config.xml << 'NSC'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system" />
                <certificates src="user" />
              </trust-anchors>
            </base-config>
          </network-security-config>
          NSC
          echo "✅ network_security_config.xml created"

      # ─────────────────────────────────────────────
      # 13. Fullscreen Themes لكل إصدارات Android
      # ─────────────────────────────────────────────
