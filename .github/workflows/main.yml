name: Build Android APK (OSSAMA TV)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install @capacitor/android
          mkdir -p www
          cp index.html www/

      - name: Initialize Capacitor
        run: |
          npx cap init "Yalla Goal" "com.ossama.yallagoal" --web-dir www

      - name: Add Android Platform
        run: npx cap add android

      - name: Configure Android Permissions & Network
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yalla-Goal-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
