apply plugin: 'com.android.application'

android {
    namespace 'com.yallagoal.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.yallagoal.app"
        minSdk 23
        targetSdk 34
        versionCode 57
        versionName "5.7"

        // LibVLC تحديداً تضيف مكتبات native ضخمة الحجم لكل معمارية معالج؛ نقتصر على المعماريتين
        // الشائعتين فعلياً على كل هواتف/أجهزة أندرويد الحقيقية تقريباً (armeabi-v7a/arm64-v8a)
        // بدل تضخيم حجم التطبيق بدعم x86/x86_64 غير المستخدم فعلياً إلا في بعض المحاكيات.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation('androidx.appcompat:appcompat:1.7.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.core:core:1.13.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.webkit:webkit:1.11.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }

    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'

    // لدعم اتصال WebSocket المباشر (تحديث فوري لعدّاد "نشط الآن" بدون أي تأخير استطلاع دوري)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // لمعرفة دقيقة بلحظة انتقال التطبيق كاملاً بين المقدمة/الخلفية (بمعزل عن دوران الشاشة
    // أو التنقل بين الشاشات الداخلية) — أساس دقة عدّاد "المستخدمين النشطين الآن"
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'

    // ==================== المشغّل الداخلي الجديد ====================

    // محرّك 1 (الافتراضي): AndroidX Media3 / ExoPlayer 1.11.0
    // ملاحظة إصدار مهمة: 1.11.0 (الأحدث وقت هذا التعديل) يفرض compileSdk 36 على أي مشروع
    // يعتمد عليه (يُتحقق منه صراحة عبر AAR Metadata عند البناء)، بينما Android Gradle Plugin
    // بهذا المشروع هو 8.5.2 الذي يدعم حتى compileSdk 34 فقط رسمياً — رفع compileSdk هنا كان
    // سيتطلب ترقية AGP نفسه أيضاً (تغيير أوسع وأكثر خطورة على بقية الاعتماديات). لذلك اعتُمد
    // إصدار 1.4.1 عمداً: من حقبة compileSdk 34/AGP 8.5.x نفسها، ومستقر تماماً (وليس Alpha/Beta).
    // كل الواجهات المستخدمة هنا (ExoPlayer.Builder، DefaultMediaSourceFactory، OkHttpDataSource،
    // PlaybackException.ERROR_CODE_*، C.TIME_UNSET، MediaItem.fromUri، PlayerView) ثابتة منذ
    // الإصدار الأول لـ Media3 ولا تتأثر بهذا الفرق بالإصدار.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    // محرّك 2 (بديل): LibVLC for Android 3.7.0 — أحدث إصدار مستقر منشور رسمياً على Maven
    // Central وقت هذا التعديل. إن فشل Gradle Sync تحديداً على هذا السطر بسبب صدور إصدار
    // أحدث لاحقاً أو سحب هذا الإصدار، راجع/حدّث الرقم من:
    // https://mvnrepository.com/artifact/org.videolan.android/libvlc-all
    implementation 'org.videolan.android:libvlc-all:3.7.0'
}

configurations.all {
    resolutionStrategy {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

apply plugin: 'com.google.gms.google-services'
